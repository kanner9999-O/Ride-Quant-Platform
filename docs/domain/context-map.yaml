  - id: context-projection
    title: Context Projection
    capability_id: context-aggregation
    responsibility: "CQRS read-model tổng hợp Structure+Regime+Feature+market state cho Strategy — Type 2 Projection (Chapter 7 §7.4), không phát sinh business decision."
    owned_contracts: [context]   # authored — Package 0.2-B4: context.md v0.2 Draft (narrow architecture revision, RA-B4-MAJ-01/IRB-B4-MAJ-01/IRB-B4-MAJ-02/IRB-B4-MAJ-03 addressed; IRB-B4-MAJ-03 (ADR-003 conflict) governance-resolved by ADR-014 Approved 2026-07-30, architecture blocker cleared; B4 still Draft, pending its own package delta review/consolidation transaction; corrected traceability RA-B4-MIN-02)
    status: active

  - id: account-reference
    title: Trading Account Reference
    capability_id: account-management
    responsibility: "Định nghĩa Trading Account identity, account boundary (venue | broker_account, ADR-012 §2.1), environment (PAPER/LIVE), lifecycle tối thiểu, và credential-reference boundary (I-11) — KHÔNG raw secret, KHÔNG Strategy/Risk/Execution/Order/Fill/Position semantics."
    owned_contracts: [account]   # authored — Package 0.2-C2: account.md v0.2 Draft — Package 0.2-C2 `Consolidated Stable` (2026-07-30), artifact status vẫn Draft (package readiness ≠ document approval); controlling architecture ADR-012 v0.3 Approved (không đổi)
    status: active

  - id: strategy-definition
    title: Strategy Definition & Instance
    capability_id: strategy-management
    responsibility: "Định nghĩa Strategy Definition Version (thesis, supported_scope, required input contracts, decision-rule ref, explanation contract ref — bất biến) và Strategy Instance (pin bốn trục evidence độc lập: strategy_definition_version_ref/plugin_version_ref/configuration_version_ref/package_build_artifact_ref, cộng account_id và instrument_selection_ref) — theo ADR-013 §2."
    owned_contracts: [strategy]   # bounded correction — Package 0.2-C3: strategy.md v0.2 Draft (đóng C3-MAJ-01/02/03/04, C3-MIN-01/02 — consolidated Review A + Independent Review B findings), chưa qua delta review; controlling architecture ADR-013 v0.3 Approved (không đổi)
    status: active

  - id: strategy-decision
    title: Decision & Trade Intent
    capability_id: decision-management
    responsibility: "Định nghĩa Decision (bản ghi authoritative của một lần Strategy Instance đánh giá deterministic, pin decision_time/decision_context_cursor theo ADR-010/Chapter 8 §8.4/§8.5, chín-field Strategy evidence tại cursor, bounded typed rule evidence, input evidence, result LONG/SHORT/NO_ACTION) và Trade Intent (request Strategy-originated trước Risk Gateway/Execution, originate từ đúng một Decision) — theo ADR-010, Chapter 8, ADR-013 (qua strategy.md)."
    owned_contracts: [decision, trade-intent]   # authored — Package 0.2-C4: decision.md v0.1 Draft + trade-intent.md v0.1 Draft, chưa qua Review A/B; controlling architecture ADR-010 Approved (Decision Time Model) + Chapter 8 §8.4/§8.5 (Locked) + ADR-013 v0.3 Approved (qua strategy.md)
    status: active

  - id: risk-gateway
    title: Risk Gateway & Execution Intent
    capability_id: risk-management
    responsibility: "Định nghĩa RiskEvaluation (bản ghi authoritative của một lần Risk Gateway đánh giá deterministic một Trade Intent eligible, pin risk_context_cursor — Chapter 8 §8.5.1 tái sử dụng — bốn trục risk evidence độc lập, bounded sizing/policy evidence, result APPROVED/REJECTED/NON_EVALUABLE) và Execution Intent (request nội bộ sau khi Risk Gateway approve, originate từ đúng một RiskEvaluation) — theo Chapter 8, Chapter 9 §9.1 (qua bốn trục risk evidence, đối xứng strategy.md)."
    owned_contracts: [risk, execution-intent]   # authored — Package 0.2-C5: risk.md v0.3 Draft + execution-intent.md v0.2 Draft (unchanged, blob preserved), micro-correction đóng C5-DELTA-MAJ-01 (evidence availability vs unit compatibility separation) trên baseline v0.2 (đóng consolidated Review A + Independent Review B findings C5-MAJ-01..06), chưa qua focused delta re-review; controlling architecture: trade-intent.md §6a (eligible_for_new_risk_evaluation), Chapter 8 §8.1.1/§8.2/§8.5 (Locked), Chapter 9 §9.1 (Locked)
    status: active

  - id: order-management
    title: Order Management
    capability_id: execution-management
    responsibility: "Định nghĩa Order (bản ghi authoritative, bất biến, của một internal execution instruction tạo từ đúng một Execution Intent eligible, pin order_context_cursor — Chapter 8 §8.5.1 tái sử dụng — order_action OPEN_EXPOSURE, order_type MARKET, quantity bất biến copy từ Execution Intent), OrderCreationAttempt (mọi lần thử tạo Order), và OrderSubmissionRequest (yêu cầu nội bộ gửi tới bounded PAPER execution boundary, chưa chứng minh venue acceptance/execution) — theo Chapter 8, execution-intent.md §6a."
    owned_contracts: [order]   # authored — Package 0.2-C6: order.md v0.1 Draft, chưa qua Review A/B; controlling architecture: execution-intent.md §6a (eligible_for_new_order_creation), Chapter 8 §8.1.1/§8.2/§8.5 (Locked)
    status: active

  - id: execution-result-management
    title: Execution Result Management
    capability_id: execution-management
    responsibility: "Định nghĩa ExecutionResult (bản ghi authoritative, bất biến, của một observation trả về từ bounded PAPER execution boundary cho một Order Submission Request — result_type EXECUTED/NOT_EXECUTED, logical result key = submission_request_id) và ExecutionResultProcessingAttempt (mọi lần thử xử lý execution result) — theo Chapter 8, order.md §8b."
    owned_contracts: [execution-result]   # authored — Package 0.2-C7: execution-result.md v0.1 Draft, chưa qua Review A/B; controlling architecture: order.md §8b (eligible_for_execution_result_processing), Chapter 8 §8.1.1/§8.2/§8.5 (Locked)
    status: active

  - id: fill-management
    title: Fill Management
    capability_id: execution-management
    responsibility: "Định nghĩa Fill (bản ghi authoritative, bất biến, của quantity/price đã thực sự executed cho một ExecutionResult result_type = EXECUTED — v0.1 full Fill duy nhất, KHÔNG partial fill) — theo Chapter 8, execution-result.md §4."
    owned_contracts: [fill]   # authored — Package 0.2-C7: fill.md v0.1 Draft, chưa qua Review A/B; controlling architecture: execution-result.md §4 (ExecutionResult), Chapter 8 §8.1.1/§8.2/§8.5 (Locked)
    status: active

  - id: position-management
    title: Position Management
    capability_id: execution-management
    responsibility: "Định nghĩa Position (deterministic, non-authoritative PROJECTION dẫn xuất từ visible-valid Fill history — position_key = account_id/environment/instrument_selection_ref, net_quantity non-negative magnitude tách biệt khỏi position_direction) — theo Chapter 7 §7.4 (Type 2 Projection), fill.md §5."
    owned_contracts: [position]   # authored — Package 0.2-C7: position.md v0.1 Draft, chưa qua Review A/B; controlling architecture: fill.md §5 (visible-valid Fill fold), Chapter 7 §7.4 (Locked)
    status: active

  - id: replay-integration
    title: Replay Integration
    capability_id: execution-management
    responsibility: "Định nghĩa ReplayStateProjection — integration contract thuần túy mô tả cách select + fold TOÀN BỘ authoritative fact đã tồn tại (Decision/Trade Intent/RiskEvaluation/Execution Intent/Order/Submission Request/ExecutionResult/Fill) tại một canonical Replay Cursor, cộng derived Position projection — KHÔNG author fact mới, KHÔNG duplicate authority — theo Chapter 8 §8.5."
    owned_contracts: [replay-event]   # authored — Package 0.2-C7: replay-event.md v0.1 Draft, chưa qua Review A/B; controlling architecture: Chapter 8 §8.5 (canonical Replay Cursor, Locked), toàn bộ Domain Contract authoritative đã author
    status: active

# Chỉ khai báo relationship mà provider contract hiện đang CẦN một cross-context relationship
# tại chính file này — hiện tại là các contract của candle.md (market-data-observation →
# market-structure-analysis/raw-regime-analysis). Sửa lại cho chính xác (đóng C-B1-CM-MIN-01):
# KHÔNG có nghĩa candle.md là provider contract DUY NHẤT tồn tại trong repository — swing.md và
# structure.md (Package 0.2-B1) cũng đã author và cũng là provider contract, nhưng quan hệ
# Swing → Structure là intra-context (cả hai cùng market-structure-analysis), nên KHÔNG cần một
# cross-context relationship ở đây (xem ghi chú dưới). Relationship liên quan instrument/venue/
# regime/feature/context sẽ được thêm khi đúng Domain Contract phía provider được author VÀ
# thực sự cần một cross-context edge — tránh trích dẫn contract_id cho một artifact chưa tồn
# tại, hoặc thêm self-edge không cần thiết cho quan hệ nội bộ một context.
#
# contract_id dùng SCALAR concept-id (khớp Chapter 4 §4.2 — ví dụ chính chương đó dùng
# "ExecutionFill.v1", một chuỗi scalar) — KHÔNG dùng display name (ví dụ "CandleClosed") hay
# event_type (ví dụ "CANDLE_CLOSED"). Ba đại lượng này KHÔNG được cạnh tranh làm identity:
# concept id ("candle-closed") là contract identity canonical; display name là văn xuôi mô tả;
# event_type là chuỗi PAST_TENSE_UPPER_SNAKE cho envelope (Chapter 3 §3.2). candle.md §2
# khai báo chính xác cả ba cho từng event, tách bạch tường minh (đóng C-CM-MAJ-01).
#
# Package 0.2-B1 (swing.md + structure.md, cả hai thuộc context market-structure-analysis):
# KHÔNG thêm self-edge (provider_context_id == consumer_context_id == market-structure-analysis)
# cho quan hệ Swing → Structure. Chapter 4 §4.2 định nghĩa relationships map là "quan hệ GIỮA
# CÁC context" — mọi ví dụ minh họa (execution → portfolio) lẫn mọi relationship đã đăng ký ở
# đây (market-data-observation → market-structure-analysis/raw-regime-analysis) đều cross-context.
# Swing → Structure là published contract nội bộ MỘT context — thuộc phạm vi chính hai Domain
# Contract đó (swing.md/structure.md), không phải Context Map. Không tự tạo self-edge chỉ để
