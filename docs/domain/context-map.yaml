      Consumer (ExecutionResult) PHẢI resolve eligible_for_execution_result_processing (order.md
      §8b) TRỰC TIẾP từ authoritative Order/Submission Request event stream TẠI
      execution_result_cursor TRƯỚC khi result processing — KHÔNG dùng OrderCurrentView latest-state
      làm input (execution-result.md §4a).

