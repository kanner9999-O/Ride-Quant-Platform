  # Package 0.2-B4 (context.md v0.2) — Context là điểm hội tụ có kiểm soát của Structure +
  # Raw Regime + Feature, fan-in trực tiếp từ cả ba context nguồn cộng market-data-observation
  # (cadence/cutoff driver, context.md §7.0/§11) — không đi vòng qua feature-engineering để lấy
  # lại Structure/Regime. Chỉ những contract mà context.md thực sự dùng (context.md §16), không
  # thêm quan hệ nào khác.
  #
  # Mười quan hệ dưới đây có `purpose: authoritative as-of snapshot aggregation` — PHÂN BIỆT
  # tường minh với Feature computation fan-in (feature-engineering → feature-computed/
  # feature-fact-invalidated tiêu thụ candle/swing/regime để TÍNH một atomic engineered value).
  # Context chỉ as-of select và sao chép fact có sẵn, KHÔNG tái sản xuất công thức Feature
  # (context.md §17). Ranh giới này được khóa tường minh bởi [ADR-014](../adr/ADR-014.md) —
  # narrow amendment của ADR-003 — Product Owner đã Approve ADR-014 ngày 2026-07-30 (sau ChatGPT
  # + Claude narrow delta review Clean). ADR-014 nay là controlling authority cho ranh giới này;
  # ADR-003 chuyển current authoritative lifecycle state Superseded tại MANIFEST (embedded
  # document status của chính ADR-003.md không đổi, bất biến — Chapter 11 §11.3). Mười quan hệ
  # dưới đây có đầy đủ architecture authority kể từ thời điểm này (context.md §ADR-003 boundary).
  - provider_context_id: market-data-observation
    consumer_context_id: context-projection
    contract_id: candle-closed
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: market-data-observation
      downstream_context_id: context-projection
    translation_policy: conformist
    purpose: "authoritative as-of snapshot aggregation (cadence/cutoff source) — không phải Feature computation, xem ADR-014"

  - provider_context_id: market-data-observation
    consumer_context_id: context-projection
    contract_id: candle-corrected
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: market-data-observation
      downstream_context_id: context-projection
    translation_policy: conformist
    purpose: "authoritative as-of snapshot aggregation (cadence/cutoff source, correction) — không phải Feature computation, xem ADR-014"
    consumer_obligation: >
      Consumer nhận CandleCorrected PHẢI invalidate hoặc recompute mọi MarketContextSnapshot
      fact có causal ancestry bao gồm Candle fact bị sửa (kể cả khi Candle đó chỉ là
      context_cutoff_source_ref) — không được giữ nguyên kết luận Context đã tính trên giá trị
      Candle cũ (chi tiết correction lineage tại context.md §12).

  - provider_context_id: market-structure-analysis
