# Authoritative registry cho Business Capability + Domain Context identity/relationship,
# theo Chapter 4 §4.2 (Locked). File này là single source of truth cho câu hỏi
# "capability/context nào tồn tại và quan hệ với nhau ra sao" — KHÔNG phải nguồn cho
# domain concept semantics (thuộc từng Domain Contract, ví dụ candle.md).
#
# Phạm vi ban đầu: 6 capability/context cho Package 0.2-A + 0.2-B. ADR-012/ADR-013 nay đã
# `Approved` (Product Owner, 2026-07-28) — Package 0.2-C gate đã mở. Package 0.2-C1 (Reference
# Foundation — instrument.md/venue.md) nay authored dưới capability/context ĐÃ đăng ký sẵn từ
# Package 0.2-A (`market-reference`/`instrument-venue-reference`, forward-declared → authored,
# không tạo capability/context mới); Package 0.2-C1 nay `Consolidated Stable` (2026-07-30).
# Package 0.2-C2 (Trading Account Foundation — account.md) đăng ký capability/context MỚI
# (`account-management`/`account-reference`) tại v0.11 — Account KHÔNG thuộc phạm vi
# `market-reference`/`instrument-venue-reference` đã có, cần capability/context riêng, controlling
# architecture [ADR-012](../adr/ADR-012.md) v0.3 Approved (Account-to-Boundary Cardinality).
# Package 0.2-C3 (Strategy Foundation — strategy.md) đăng ký capability/context MỚI
# (`strategy-management`/`strategy-definition`) tại v0.12 — Strategy Definition Version/Strategy
# Instance KHÔNG thuộc phạm vi `account-management`/`account-reference` đã có, cần capability/
# context riêng, controlling architecture [ADR-013](../adr/ADR-013.md) v0.3 Approved (Strategy
# Definition Version — Independent Evidence Axis). KHÔNG thêm relationship edge cho
# strategy-definition: strategy.md chỉ dùng simple `ref:` lookup tới account (account_id) và tới
# chính nó (strategy_definition_version_ref) — không có published-language event-stream flow
# cross-context nào strategy.md thực sự tiêu thụ ở v0.1 (cùng precedent account.md §13's venue_id
# ref không cần edge).
# Package 0.2-C4 (Trade Intent and Decision Foundation — decision.md + trade-intent.md) đăng ký
# capability/context MỚI (`decision-management`/`strategy-decision`) tại v0.14 — Decision/Trade
# Intent KHÔNG thuộc phạm vi `strategy-management`/`strategy-definition` đã có, cần capability/
# context riêng, controlling architecture [ADR-010](../adr/ADR-010.md) Approved (Decision Time
# Model) + Chapter 8 §8.4/§8.5 (Locked) + [ADR-013](../adr/ADR-013.md) v0.3 Approved (qua
# strategy.md). Hai file (decision.md/trade-intent.md) CÙNG một context — hai concept riêng biệt,
# KHÔNG gộp một file, nhưng cùng thuộc phạm vi ra-quyết-định, KHÔNG cần hai context riêng.
# KHÔNG thêm relationship edge cho strategy-decision: decision.md/trade-intent.md chỉ dùng simple
# `ref:` lookup tới strategy (strategy_instance_id), account (account_id), và opaque
# `event_record_ref` chưa resolve/redefine (candle/reference-series input evidence, deferred
# §14 decision.md) — KHÔNG có published-language event-stream flow cross-context nào thực sự
# implemented ở v0.1 (cùng precedent strategy.md's account_id/instrument_selection_ref ref không
# cần edge; input evidence là opaque reference chưa gắn provider context cụ thể, thêm edge lúc
# này sẽ là speculative).
# Package 0.2-C5 (Risk Gateway and Execution Intent Foundation — risk.md + execution-intent.md)
# đăng ký capability/context MỚI (`risk-management`/`risk-gateway`) tại v0.15 — Risk/Execution
# Intent KHÔNG thuộc phạm vi `decision-management`/`strategy-decision` đã có, cần capability/
# context riêng. Hai file (risk.md/execution-intent.md) CÙNG một context — hai concept riêng
# biệt, KHÔNG gộp một file, nhưng cùng thuộc phạm vi risk-gateway, KHÔNG cần hai context riêng.
# KHÔNG thêm relationship edge cho risk-gateway: risk.md/execution-intent.md chỉ dùng simple
# `ref:` lookup tới trade-intent (trade_intent_id), account (account_id), và opaque
# `event_record_ref` chưa resolve/redefine (available_account_equity_ref/
# current_instrument_exposure_ref/reference_price_fact_ref, deferred §15 risk.md) — KHÔNG có
# published-language event-stream flow cross-context nào thực sự implemented ở v0.1 (cùng
# precedent strategy-decision's account_id/instrument_selection_ref ref không cần edge).
# Package 0.2-C6 (Order Foundation — order.md) đăng ký capability/context MỚI
# (`execution-management`/`order-management`) tại v0.18 — Order KHÔNG thuộc phạm vi
# `risk-management`/`risk-gateway` đã có (Execution Intent KHÔNG phải Order), cần capability/
# context riêng, controlling architecture execution-intent.md §6a (eligible_for_new_order_creation).
# MỘT relationship edge MỚI: risk-gateway (execution-intent) → order-management (order) —
# order.md thực sự tiêu thụ published-language `execution-intent-issued` (subject_ref/scope copy +
# causation_refs trace-back, §4 order.md) VÀ eligibility rule `eligible_for_new_order_creation`
# (execution-intent.md §6a) — khác precedent risk-gateway/strategy-decision (KHÔNG edge, chỉ simple
# `ref:` lookup) vì đây là published-language fact CONSUME thực tế cho Order creation, không phải
# opaque reference chưa gắn provider context.
# Package 0.2-C7 (Execution Result, Fill, Position and Replay Integration Foundation —
# execution-result.md + fill.md + position.md + replay-event.md) đăng ký BỐN context MỚI CÙNG
# capability `execution-management` đã có từ C6 (`execution-result-management`/`fill-management`/
# `position-management`/`replay-integration` — KHÔNG capability mới, bốn concept này cùng thuộc
# execution management) tại v0.19. `position.md` là derived projection (KHÔNG authoritative event
# stream) nhưng vẫn cần context riêng để đăng ký `owned_contracts: [position]` theo đúng convention.
# Mười relationship edge MỚI, đúng nguyên tắc "chỉ đăng ký khi thực sự có published-language flow
# CONSUME" (không phải opaque ref: lookup): (1) order-management → execution-result-management
# (order-submission-requested — ExecutionResult eligibility genuinely consume Order/Submission
# Request lineage, execution-result.md §4a); (2) execution-result-management → fill-management
# (execution-result-recorded — Fill causation_refs bắt buộc); (3) fill-management →
# position-management (fill-recorded — Position fold trực tiếp từ Fill stream, position.md §2);
# (4)-(10) authoritative domain contexts → replay-integration (strategy-decision × 2:
# decision-recorded + trade-intent-issued; risk-gateway × 2: risk-evaluation-recorded +
# execution-intent-issued; order-management: order-created; execution-result-management:
# execution-result-recorded; fill-management: fill-recorded — ReplayStateProjection genuinely folds
# TỪNG stream này, KHÔNG chỉ opaque ref:, replay-event.md §2). KHÔNG edge cho position-management →
# replay-integration vì Position KHÔNG có authoritative event/published-language contract (chỉ
# `ref: position` trực tiếp, derived projection — đúng nguyên tắc "Current View KHÔNG BAO GIỜ
# authority" áp dụng luôn cho derived projection không-event-stream).

capabilities:
  - id: market-reference
    title: Market Reference Data
    responsibility: "Sở hữu identity và metadata tham chiếu của Instrument và Venue — precision, tick/lot size, trading calendar/session. Venue-neutral theo ADR-007."
    status: active

  - id: market-data
    title: Market Data
    responsibility: "Sản xuất market-data fact bitemporal (Candle, và về sau Trade/Quote) từ nguồn venue, chuẩn hóa venue-specific schema về canonical domain language."
    status: active

  - id: market-structure
    title: Market Structure
    responsibility: "Produce authoritative market-structure interpretation."
    status: active

  - id: market-regime
    title: Market Regime
    responsibility: "Sản xuất Regime (trending/ranging/volatile) chỉ từ raw market data, độc lập hoàn toàn với Market Structure (ADR-003)."
    status: active

  - id: feature-engineering
    title: Feature Engineering
    responsibility: "Fan-in có chọn lọc từ Market Structure và Market Regime thành Feature dùng cho Context/Strategy (ADR-003)."
    status: active

  - id: context-aggregation
    title: Context Aggregation
    responsibility: "Tổng hợp CQRS các projection (Structure/Regime/Feature/market state) thành một Context snapshot cho Strategy tiêu thụ — KHÔNG sở hữu business decision (Chapter 7 §7.4)."
    status: active

  - id: account-management
    title: Account Management
    responsibility: "Sở hữu Trading Account identity, account boundary binding (venue hoặc broker_account, theo ADR-012), environment distinction (PAPER/LIVE), và lifecycle tối thiểu — KHÔNG sở hữu credential/secret material (I-11), KHÔNG sở hữu Strategy/Risk/Execution/Order/Fill/Position semantics."
    status: active

  - id: strategy-management
    title: Strategy Management
    responsibility: "Sở hữu Strategy Definition Version identity (business/decision semantics bất biến, theo ADR-013) và Strategy Instance identity (runtime binding pin bốn trục evidence độc lập + Account + instrument selection) — KHÔNG sở hữu Plugin Definition/Plugin Version/Package-Build-Artifact schema (Chapter 9), KHÔNG sở hữu Trade Intent/Decision/Risk/Execution/Order/Fill/Position semantics."
    status: active

  - id: decision-management
    title: Decision Management
    responsibility: "Sở hữu Decision identity (bản ghi authoritative của một lần Strategy Instance đánh giá deterministic tại một decision_context_cursor, theo ADR-010/Chapter 8 §8.4/§8.5) và Trade Intent identity (request Strategy-originated trước Risk Gateway/Execution) — KHÔNG sở hữu Risk approval/rejection, Execution Intent/Order/Fill/Position semantics, KHÔNG sở hữu Strategy/Strategy Instance identity (thuộc strategy-management)."
    status: active

  - id: risk-management
    title: Risk Management
    responsibility: "Sở hữu RiskEvaluation identity (bản ghi authoritative của một lần Risk Gateway đánh giá deterministic một Trade Intent eligible, pin bốn trục risk evidence độc lập + sizing/policy evidence) và Execution Intent identity (request nội bộ sau khi Risk Gateway approve, trước Order/Execution) — KHÔNG sở hữu Order/Fill/Position/Replay Event semantics (Package 0.2-C6–C7), KHÔNG sở hữu Decision/Trade Intent identity (thuộc decision-management)."
    status: active

  - id: execution-management
    title: Execution Management
    responsibility: "Sở hữu Order identity (bản ghi authoritative, bất biến, của một internal execution instruction tạo từ đúng một Execution Intent eligible), OrderCreationAttempt (mọi lần thử tạo Order), và OrderSubmissionRequest (yêu cầu nội bộ gửi Order tới bounded PAPER execution boundary) — KHÔNG sở hữu Fill/Position/Replay Event semantics (Package 0.2-C7), KHÔNG sở hữu Risk/Execution Intent identity (thuộc risk-management)."
    status: active

contexts:
  - id: instrument-venue-reference
    title: Instrument & Venue Reference
    capability_id: market-reference
    responsibility: "Định nghĩa Instrument và Venue identity, precision/tick/lot metadata, và trading calendar/session — venue-neutral, không giả định 24/7 (ADR-007)."
    owned_contracts: [instrument, venue]   # authored — Package 0.2-C1: instrument.md v0.6 Draft + venue.md v0.3 Draft — Package 0.2-C1 `Consolidated Stable` (2026-07-30), artifact status vẫn Draft (package readiness ≠ document approval)
    status: active

  - id: market-data-observation
    title: Market Data Observation
    capability_id: market-data
    responsibility: "Quan sát và ghi nhận market-data fact (Candle observed/closed/corrected) theo bitemporal semantics (Chapter 5)."
    owned_contracts: [candle]
    status: active

  - id: market-structure-analysis
    title: Market Structure Analysis
    capability_id: market-structure
    responsibility: "Define Swing, BOS, CHoCH and related structure semantics."
    owned_contracts: [swing, structure]   # authored — Package 0.2-B1: swing.md v0.2 Draft, structure.md v0.2 Draft (consolidated revision xử lý ChatGPT Review A + Independent Review B findings; Package 0.2-B chưa Consolidated Stable)
    status: active

  - id: raw-regime-analysis
    title: Raw Regime Analysis
    capability_id: market-regime
    responsibility: "Định nghĩa Regime semantics tính trực tiếp từ raw market data (volatility, ADX, volume profile...), độc lập Structure Engine."
    owned_contracts: [regime]   # authored — Package 0.2-B2: regime.md v0.1 Draft (author self-review only, chưa qua Review A/B)
    status: active

  - id: feature-engineering
    title: Feature Engineering
    capability_id: feature-engineering
    responsibility: "Định nghĩa Feature — fan-in có chọn lọc từ Structure và Regime, xử lý đồng bộ hóa (join) hai luồng khi cần."
    owned_contracts: [feature]   # authored — Package 0.2-B3: feature.md v0.2 Draft (Consolidated Stable — ChatGPT Review A + Independent Review B Clean, 0 finding)
