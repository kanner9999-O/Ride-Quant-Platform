id: context-map
title: Context Map — Ride Quant Platform
version: "0.6"
status: Draft
owner: Product Owner
reviewers: []
approved_by: null
approved_at: null
created_at: "2026-07-28"
last_review: null
next_review: null

# Authoritative registry cho Business Capability + Domain Context identity/relationship,
# theo Chapter 4 §4.2 (Locked). File này là single source of truth cho câu hỏi
# "capability/context nào tồn tại và quan hệ với nhau ra sao" — KHÔNG phải nguồn cho
# domain concept semantics (thuộc từng Domain Contract, ví dụ candle.md).
#
# Phạm vi ban đầu: 6 capability/context cho Package 0.2-A + 0.2-B. ADR-012/ADR-013 nay đã
# `Approved` (Product Owner, 2026-07-28) — Package 0.2-C (Account, Strategy, Decision, Risk,
# Execution, Position...) vẫn CHƯA đăng ký, chờ authoring thực tế (gate đã mở, chưa dùng).

capabilities:
  - id: market-reference
    title: Market Reference Data
    responsibility: "Sở hữu identity và metadata tham chiếu của Instrument và Venue — precision, tick/lot size, trading calendar/session. Venue-neutral theo ADR-007."
    status: active

  - id: market-data
    title: Market Data
    responsibility: "Sản xuất market-data fact bitemporal (Candle, và về sau Trade/Quote) từ nguồn venue, chuẩn hóa venue-specific schema về canonical domain language."
    status: active

  - id: market-structure
    title: Market Structure
    responsibility: "Produce authoritative market-structure interpretation."
    status: active

  - id: market-regime
    title: Market Regime
    responsibility: "Sản xuất Regime (trending/ranging/volatile) chỉ từ raw market data, độc lập hoàn toàn với Market Structure (ADR-003)."
    status: active

  - id: feature-engineering
    title: Feature Engineering
    responsibility: "Fan-in có chọn lọc từ Market Structure và Market Regime thành Feature/Signal dùng cho Strategy (ADR-003)."
    status: active

  - id: context-aggregation
    title: Context Aggregation
    responsibility: "Tổng hợp CQRS các projection (Structure/Regime/Feature/market state) thành một Context snapshot cho Strategy tiêu thụ — KHÔNG sở hữu business decision (Chapter 7 §7.4)."
    status: active

contexts:
  - id: instrument-venue-reference
    title: Instrument & Venue Reference
    capability_id: market-reference
    responsibility: "Định nghĩa Instrument và Venue identity, precision/tick/lot metadata, và trading calendar/session — venue-neutral, không giả định 24/7 (ADR-007)."
    owned_contracts: [instrument, venue]   # forward-declared — chưa authored trong commit này
    status: active

  - id: market-data-observation
    title: Market Data Observation
    capability_id: market-data
    responsibility: "Quan sát và ghi nhận market-data fact (Candle observed/closed/corrected) theo bitemporal semantics (Chapter 5)."
    owned_contracts: [candle]
    status: active

  - id: market-structure-analysis
    title: Market Structure Analysis
    capability_id: market-structure
    responsibility: "Define Swing, BOS, CHoCH and related structure semantics."
    owned_contracts: [swing, structure]   # authored — Package 0.2-B1: swing.md v0.2 Draft, structure.md v0.2 Draft (consolidated revision xử lý ChatGPT Review A + Independent Review B findings; Package 0.2-B chưa Consolidated Stable)
    status: active

  - id: raw-regime-analysis
    title: Raw Regime Analysis
    capability_id: market-regime
    responsibility: "Định nghĩa Regime semantics tính trực tiếp từ raw market data (volatility, ADX, volume profile...), độc lập Structure Engine."
    owned_contracts: [regime]   # authored — Package 0.2-B2: regime.md v0.1 Draft (author self-review only, chưa qua Review A/B)
    status: active

  - id: feature-engineering
    title: Feature Engineering
    capability_id: feature-engineering
    responsibility: "Định nghĩa Feature/Signal — fan-in có chọn lọc từ Structure và Regime, xử lý đồng bộ hóa (join) hai luồng khi cần."
    owned_contracts: [feature]   # forward-declared — Package 0.2-B, chưa authored
    status: active

  - id: context-projection
    title: Context Projection
    capability_id: context-aggregation
    responsibility: "CQRS read-model tổng hợp Structure+Regime+Feature+market state cho Strategy — Type 2 Projection (Chapter 7 §7.4), không phát sinh business decision."
    owned_contracts: [context]   # forward-declared — Package 0.2-B, chưa authored
    status: active

# Chỉ khai báo relationship mà provider contract hiện đang CẦN một cross-context relationship
# tại chính file này — hiện tại là các contract của candle.md (market-data-observation →
# market-structure-analysis/raw-regime-analysis). Sửa lại cho chính xác (đóng C-B1-CM-MIN-01):
# KHÔNG có nghĩa candle.md là provider contract DUY NHẤT tồn tại trong repository — swing.md và
# structure.md (Package 0.2-B1) cũng đã author và cũng là provider contract, nhưng quan hệ
# Swing → Structure là intra-context (cả hai cùng market-structure-analysis), nên KHÔNG cần một
# cross-context relationship ở đây (xem ghi chú dưới). Relationship liên quan instrument/venue/
# regime/feature/context sẽ được thêm khi đúng Domain Contract phía provider được author VÀ
# thực sự cần một cross-context edge — tránh trích dẫn contract_id cho một artifact chưa tồn
# tại, hoặc thêm self-edge không cần thiết cho quan hệ nội bộ một context.
#
# contract_id dùng SCALAR concept-id (khớp Chapter 4 §4.2 — ví dụ chính chương đó dùng
# "ExecutionFill.v1", một chuỗi scalar) — KHÔNG dùng display name (ví dụ "CandleClosed") hay
# event_type (ví dụ "CANDLE_CLOSED"). Ba đại lượng này KHÔNG được cạnh tranh làm identity:
# concept id ("candle-closed") là contract identity canonical; display name là văn xuôi mô tả;
# event_type là chuỗi PAST_TENSE_UPPER_SNAKE cho envelope (Chapter 3 §3.2). candle.md §2
# khai báo chính xác cả ba cho từng event, tách bạch tường minh (đóng C-CM-MAJ-01).
#
# Package 0.2-B1 (swing.md + structure.md, cả hai thuộc context market-structure-analysis):
# KHÔNG thêm self-edge (provider_context_id == consumer_context_id == market-structure-analysis)
# cho quan hệ Swing → Structure. Chapter 4 §4.2 định nghĩa relationships map là "quan hệ GIỮA
# CÁC context" — mọi ví dụ minh họa (execution → portfolio) lẫn mọi relationship đã đăng ký ở
# đây (market-data-observation → market-structure-analysis/raw-regime-analysis) đều cross-context.
# Swing → Structure là published contract nội bộ MỘT context — thuộc phạm vi chính hai Domain
# Contract đó (swing.md/structure.md), không phải Context Map. Không tự tạo self-edge chỉ để
# biểu diễn sequencing.
relationships:
  - provider_context_id: market-data-observation
    consumer_context_id: market-structure-analysis
    contract_id: candle-closed
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: market-data-observation
      downstream_context_id: market-structure-analysis
    translation_policy: conformist   # Structure tiêu thụ trực tiếp canonical Candle language, không cần anti-corruption layer

  - provider_context_id: market-data-observation
    consumer_context_id: market-structure-analysis
    contract_id: candle-corrected
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: market-data-observation
      downstream_context_id: market-structure-analysis
    translation_policy: conformist
    consumer_obligation: >
      Consumer nhận CandleCorrected PHẢI invalidate hoặc recompute mọi derived fact có
      causal ancestry bao gồm Candle fact bị sửa — không được giữ nguyên kết luận Structure
      đã tính trên giá trị Candle cũ (đóng C-CM-MAJ-02; chi tiết correction/recompute và
      classification semantics tại candle.md §§10–11).

  - provider_context_id: market-data-observation
    consumer_context_id: raw-regime-analysis
    contract_id: candle-closed
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: market-data-observation
      downstream_context_id: raw-regime-analysis
    translation_policy: conformist

  - provider_context_id: market-data-observation
    consumer_context_id: raw-regime-analysis
    contract_id: candle-corrected
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: market-data-observation
      downstream_context_id: raw-regime-analysis
    translation_policy: conformist
    consumer_obligation: >
      Consumer nhận CandleCorrected PHẢI invalidate hoặc recompute mọi derived fact có
      causal ancestry bao gồm Candle fact bị sửa — không được giữ nguyên kết luận Regime
      đã tính trên giá trị Candle cũ (đóng C-CM-MAJ-02; chi tiết correction/recompute và
      classification semantics tại candle.md §§10–11).
