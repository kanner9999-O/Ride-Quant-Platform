# Authoritative registry cho Business Capability + Domain Context identity/relationship,
# theo Chapter 4 §4.2 (Locked). File này là single source of truth cho câu hỏi
# "capability/context nào tồn tại và quan hệ với nhau ra sao" — KHÔNG phải nguồn cho
# domain concept semantics (thuộc từng Domain Contract, ví dụ candle.md).
#
# Phạm vi ban đầu: 6 capability/context cho Package 0.2-A + 0.2-B. ADR-012/ADR-013 nay đã
# `Approved` (Product Owner, 2026-07-28) — Package 0.2-C (Account, Strategy, Decision, Risk,
# Execution, Position...) vẫn CHƯA đăng ký, chờ authoring thực tế (gate đã mở, chưa dùng).

capabilities:
  - id: market-reference
    title: Market Reference Data
    responsibility: "Sở hữu identity và metadata tham chiếu của Instrument và Venue — precision, tick/lot size, trading calendar/session. Venue-neutral theo ADR-007."
    status: active

  - id: market-data
    title: Market Data
    responsibility: "Sản xuất market-data fact bitemporal (Candle, và về sau Trade/Quote) từ nguồn venue, chuẩn hóa venue-specific schema về canonical domain language."
    status: active

  - id: market-structure
    title: Market Structure
    responsibility: "Produce authoritative market-structure interpretation."
    status: active

  - id: market-regime
    title: Market Regime
    responsibility: "Sản xuất Regime (trending/ranging/volatile) chỉ từ raw market data, độc lập hoàn toàn với Market Structure (ADR-003)."
    status: active

  - id: feature-engineering
    title: Feature Engineering
    responsibility: "Fan-in có chọn lọc từ Market Structure và Market Regime thành Feature dùng cho Context/Strategy (ADR-003)."
    status: active

  - id: context-aggregation
    title: Context Aggregation
    responsibility: "Tổng hợp CQRS các projection (Structure/Regime/Feature/market state) thành một Context snapshot cho Strategy tiêu thụ — KHÔNG sở hữu business decision (Chapter 7 §7.4)."
    status: active

contexts:
  - id: instrument-venue-reference
    title: Instrument & Venue Reference
    capability_id: market-reference
    responsibility: "Định nghĩa Instrument và Venue identity, precision/tick/lot metadata, và trading calendar/session — venue-neutral, không giả định 24/7 (ADR-007)."
    owned_contracts: [instrument, venue]   # forward-declared — chưa authored trong commit này
    status: active

  - id: market-data-observation
    title: Market Data Observation
    capability_id: market-data
    responsibility: "Quan sát và ghi nhận market-data fact (Candle observed/closed/corrected) theo bitemporal semantics (Chapter 5)."
    owned_contracts: [candle]
    status: active

  - id: market-structure-analysis
    title: Market Structure Analysis
    capability_id: market-structure
    responsibility: "Define Swing, BOS, CHoCH and related structure semantics."
    owned_contracts: [swing, structure]   # authored — Package 0.2-B1: swing.md v0.2 Draft, structure.md v0.2 Draft (consolidated revision xử lý ChatGPT Review A + Independent Review B findings; Package 0.2-B chưa Consolidated Stable)
    status: active

  - id: raw-regime-analysis
    title: Raw Regime Analysis
    capability_id: market-regime
    responsibility: "Định nghĩa Regime semantics tính trực tiếp từ raw market data (volatility, ADX, volume profile...), độc lập Structure Engine."
    owned_contracts: [regime]   # authored — Package 0.2-B2: regime.md v0.1 Draft (author self-review only, chưa qua Review A/B)
    status: active

  - id: feature-engineering
    title: Feature Engineering
    capability_id: feature-engineering
    responsibility: "Định nghĩa Feature — fan-in có chọn lọc từ Structure và Regime, xử lý đồng bộ hóa (join) hai luồng khi cần."
    owned_contracts: [feature]   # authored — Package 0.2-B3: feature.md v0.2 Draft (Consolidated Stable — ChatGPT Review A + Independent Review B Clean, 0 finding)
    status: active

  - id: context-projection
    title: Context Projection
    capability_id: context-aggregation
    responsibility: "CQRS read-model tổng hợp Structure+Regime+Feature+market state cho Strategy — Type 2 Projection (Chapter 7 §7.4), không phát sinh business decision."
    owned_contracts: [context]   # authored — Package 0.2-B4: context.md v0.2 Draft (narrow architecture revision, RA-B4-MAJ-01/IRB-B4-MAJ-01/IRB-B4-MAJ-02/IRB-B4-MAJ-03 addressed; IRB-B4-MAJ-03 (ADR-003 conflict) governance-resolved by ADR-014 Approved 2026-07-30, architecture blocker cleared; B4 still Draft, pending its own package delta review/consolidation transaction; corrected traceability RA-B4-MIN-02)
    status: active

# Chỉ khai báo relationship mà provider contract hiện đang CẦN một cross-context relationship
# tại chính file này — hiện tại là các contract của candle.md (market-data-observation →
# market-structure-analysis/raw-regime-analysis). Sửa lại cho chính xác (đóng C-B1-CM-MIN-01):
# KHÔNG có nghĩa candle.md là provider contract DUY NHẤT tồn tại trong repository — swing.md và
# structure.md (Package 0.2-B1) cũng đã author và cũng là provider contract, nhưng quan hệ
# Swing → Structure là intra-context (cả hai cùng market-structure-analysis), nên KHÔNG cần một
# cross-context relationship ở đây (xem ghi chú dưới). Relationship liên quan instrument/venue/
# regime/feature/context sẽ được thêm khi đúng Domain Contract phía provider được author VÀ
# thực sự cần một cross-context edge — tránh trích dẫn contract_id cho một artifact chưa tồn
# tại, hoặc thêm self-edge không cần thiết cho quan hệ nội bộ một context.
#
# contract_id dùng SCALAR concept-id (khớp Chapter 4 §4.2 — ví dụ chính chương đó dùng
# "ExecutionFill.v1", một chuỗi scalar) — KHÔNG dùng display name (ví dụ "CandleClosed") hay
# event_type (ví dụ "CANDLE_CLOSED"). Ba đại lượng này KHÔNG được cạnh tranh làm identity:
# concept id ("candle-closed") là contract identity canonical; display name là văn xuôi mô tả;
# event_type là chuỗi PAST_TENSE_UPPER_SNAKE cho envelope (Chapter 3 §3.2). candle.md §2
# khai báo chính xác cả ba cho từng event, tách bạch tường minh (đóng C-CM-MAJ-01).
#
# Package 0.2-B1 (swing.md + structure.md, cả hai thuộc context market-structure-analysis):
# KHÔNG thêm self-edge (provider_context_id == consumer_context_id == market-structure-analysis)
# cho quan hệ Swing → Structure. Chapter 4 §4.2 định nghĩa relationships map là "quan hệ GIỮA
# CÁC context" — mọi ví dụ minh họa (execution → portfolio) lẫn mọi relationship đã đăng ký ở
# đây (market-data-observation → market-structure-analysis/raw-regime-analysis) đều cross-context.
# Swing → Structure là published contract nội bộ MỘT context — thuộc phạm vi chính hai Domain
# Contract đó (swing.md/structure.md), không phải Context Map. Không tự tạo self-edge chỉ để
# biểu diễn sequencing.
relationships:
  - provider_context_id: market-data-observation
    consumer_context_id: market-structure-analysis
    contract_id: candle-closed
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: market-data-observation
      downstream_context_id: market-structure-analysis
    translation_policy: conformist   # Structure tiêu thụ trực tiếp canonical Candle language, không cần anti-corruption layer

  - provider_context_id: market-data-observation
    consumer_context_id: market-structure-analysis
    contract_id: candle-corrected
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: market-data-observation
      downstream_context_id: market-structure-analysis
    translation_policy: conformist
    consumer_obligation: >
      Consumer nhận CandleCorrected PHẢI invalidate hoặc recompute mọi derived fact có
      causal ancestry bao gồm Candle fact bị sửa — không được giữ nguyên kết luận Structure
      đã tính trên giá trị Candle cũ (đóng C-CM-MAJ-02; chi tiết correction/recompute và
      classification semantics tại candle.md §§10–11).

  - provider_context_id: market-data-observation
    consumer_context_id: raw-regime-analysis
    contract_id: candle-closed
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: market-data-observation
      downstream_context_id: raw-regime-analysis
    translation_policy: conformist

  - provider_context_id: market-data-observation
    consumer_context_id: raw-regime-analysis
    contract_id: candle-corrected
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: market-data-observation
      downstream_context_id: raw-regime-analysis
    translation_policy: conformist
    consumer_obligation: >
      Consumer nhận CandleCorrected PHẢI invalidate hoặc recompute mọi derived fact có
      causal ancestry bao gồm Candle fact bị sửa — không được giữ nguyên kết luận Regime
      đã tính trên giá trị Candle cũ (đóng C-CM-MAJ-02; chi tiết correction/recompute và
      classification semantics tại candle.md §§10–11).

  # Package 0.2-B3 (feature.md v0.1) — Feature là điểm fan-in có kiểm soát từ Candle/Swing/
  # Raw Regime (ADR-003). Ba founding feature type tiêu thụ chính xác các contract dưới đây —
  # không thêm quan hệ nào ngoài những gì feature.md thực sự dùng (§14 feature.md).
  - provider_context_id: market-data-observation
    consumer_context_id: feature-engineering
    contract_id: candle-closed
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: market-data-observation
      downstream_context_id: feature-engineering
    translation_policy: conformist

  - provider_context_id: market-data-observation
    consumer_context_id: feature-engineering
    contract_id: candle-corrected
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: market-data-observation
      downstream_context_id: feature-engineering
    translation_policy: conformist
    consumer_obligation: >
      Consumer nhận CandleCorrected PHẢI invalidate hoặc recompute mọi FeatureComputed fact có
      causal ancestry bao gồm Candle fact bị sửa — không được giữ nguyên kết luận Feature đã
      tính trên giá trị Candle cũ (chi tiết correction lineage tại feature.md §9).

  - provider_context_id: market-structure-analysis
    consumer_context_id: feature-engineering
    contract_id: swing-confirmed
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: market-structure-analysis
      downstream_context_id: feature-engineering
    translation_policy: conformist

  - provider_context_id: market-structure-analysis
    consumer_context_id: feature-engineering
    contract_id: swing-invalidated
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: market-structure-analysis
      downstream_context_id: feature-engineering
    translation_policy: conformist
    consumer_obligation: >
      Consumer nhận SwingInvalidated PHẢI invalidate hoặc recompute mọi FeatureComputed fact
      (distance_to_last_confirmed_swing) có causal ancestry bao gồm Swing fact bị invalidate
      — không được giữ nguyên khoảng cách đã tính trên Swing đã invalidate (chi tiết correction
      lineage tại feature.md §9, eligible-Swing re-selection tại feature.md §9a).

  - provider_context_id: raw-regime-analysis
    consumer_context_id: feature-engineering
    contract_id: regime-classified
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: raw-regime-analysis
      downstream_context_id: feature-engineering
    translation_policy: conformist

  - provider_context_id: raw-regime-analysis
    consumer_context_id: feature-engineering
    contract_id: regime-fact-invalidated
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: raw-regime-analysis
      downstream_context_id: feature-engineering
    translation_policy: conformist
    consumer_obligation: >
      Consumer nhận RegimeFactInvalidated PHẢI invalidate hoặc recompute mọi FeatureComputed
      fact (upstream_source: regime) có causal ancestry bao gồm RegimeClassified fact bị
      invalidate — không được giữ nguyên giá trị đã tính trên fact Regime cũ (chi tiết
      correction lineage tại feature.md §9).

  # Package 0.2-B4 (context.md v0.2) — Context là điểm hội tụ có kiểm soát của Structure +
  # Raw Regime + Feature, fan-in trực tiếp từ cả ba context nguồn cộng market-data-observation
  # (cadence/cutoff driver, context.md §7.0/§11) — không đi vòng qua feature-engineering để lấy
  # lại Structure/Regime. Chỉ những contract mà context.md thực sự dùng (context.md §16), không
  # thêm quan hệ nào khác.
  #
  # Mười quan hệ dưới đây có `purpose: authoritative as-of snapshot aggregation` — PHÂN BIỆT
  # tường minh với Feature computation fan-in (feature-engineering → feature-computed/
  # feature-fact-invalidated tiêu thụ candle/swing/regime để TÍNH một atomic engineered value).
  # Context chỉ as-of select và sao chép fact có sẵn, KHÔNG tái sản xuất công thức Feature
  # (context.md §17). Ranh giới này được khóa tường minh bởi [ADR-014](../adr/ADR-014.md) —
  # narrow amendment của ADR-003 — Product Owner đã Approve ADR-014 ngày 2026-07-30 (sau ChatGPT
  # + Claude narrow delta review Clean). ADR-014 nay là controlling authority cho ranh giới này;
  # ADR-003 chuyển current authoritative lifecycle state Superseded tại MANIFEST (embedded
  # document status của chính ADR-003.md không đổi, bất biến — Chapter 11 §11.3). Mười quan hệ
  # dưới đây có đầy đủ architecture authority kể từ thời điểm này (context.md §ADR-003 boundary).
  - provider_context_id: market-data-observation
    consumer_context_id: context-projection
    contract_id: candle-closed
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: market-data-observation
      downstream_context_id: context-projection
    translation_policy: conformist
    purpose: "authoritative as-of snapshot aggregation (cadence/cutoff source) — không phải Feature computation, xem ADR-014"

  - provider_context_id: market-data-observation
    consumer_context_id: context-projection
    contract_id: candle-corrected
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: market-data-observation
      downstream_context_id: context-projection
    translation_policy: conformist
    purpose: "authoritative as-of snapshot aggregation (cadence/cutoff source, correction) — không phải Feature computation, xem ADR-014"
    consumer_obligation: >
      Consumer nhận CandleCorrected PHẢI invalidate hoặc recompute mọi MarketContextSnapshot
      fact có causal ancestry bao gồm Candle fact bị sửa (kể cả khi Candle đó chỉ là
      context_cutoff_source_ref) — không được giữ nguyên kết luận Context đã tính trên giá trị
      Candle cũ (chi tiết correction lineage tại context.md §12).

  - provider_context_id: market-structure-analysis
    consumer_context_id: context-projection
    contract_id: break-of-structure-detected
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: market-structure-analysis
      downstream_context_id: context-projection
    translation_policy: conformist
    purpose: "authoritative as-of snapshot aggregation (Structure orientation, §8 Phase 2) — không phải Feature computation, xem ADR-014"

  - provider_context_id: market-structure-analysis
    consumer_context_id: context-projection
    contract_id: change-of-character-detected
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: market-structure-analysis
      downstream_context_id: context-projection
    translation_policy: conformist
    purpose: "authoritative as-of snapshot aggregation (Structure orientation, §8 Phase 2) — không phải Feature computation, xem ADR-014"

  - provider_context_id: market-structure-analysis
    consumer_context_id: context-projection
    contract_id: structure-fact-invalidated
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: market-structure-analysis
      downstream_context_id: context-projection
    translation_policy: conformist
    purpose: "authoritative as-of snapshot aggregation (Structure eligibility filtering, §8 Phase 1) — không phải Feature computation, xem ADR-014"
    consumer_obligation: >
      Consumer nhận StructureFactInvalidated targeting fact đang là structure_fact_ref của một
      MarketContextSnapshot PHẢI invalidate hoặc recompute snapshot đó — không được giữ nguyên
      structure_orientation đã tính trên fact Structure đã invalidate (chi tiết correction
      lineage tại context.md §12, Eligible Structure fact selection tại context.md §8).

  - provider_context_id: market-structure-analysis
    consumer_context_id: context-projection
    contract_id: structure-recomputed
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: market-structure-analysis
      downstream_context_id: context-projection
    translation_policy: conformist
    purpose: "authoritative as-of snapshot aggregation (Structure orientation, §8 Phase 2) — không phải Feature computation, xem ADR-014"

  - provider_context_id: raw-regime-analysis
    consumer_context_id: context-projection
    contract_id: regime-classified
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: raw-regime-analysis
      downstream_context_id: context-projection
    translation_policy: conformist
    purpose: "authoritative as-of snapshot aggregation (Regime class, hai dimension) — không phải Feature computation, xem ADR-014"

  - provider_context_id: raw-regime-analysis
    consumer_context_id: context-projection
    contract_id: regime-fact-invalidated
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: raw-regime-analysis
      downstream_context_id: context-projection
    translation_policy: conformist
    purpose: "authoritative as-of snapshot aggregation (Regime eligibility filtering, §8 Phase 1) — không phải Feature computation, xem ADR-014"
    consumer_obligation: >
      Consumer nhận RegimeFactInvalidated PHẢI invalidate hoặc recompute mọi MarketContextSnapshot
      fact có causal ancestry bao gồm RegimeClassified fact bị invalidate (volatility hoặc
      directional_persistence) — không được giữ nguyên regime class đã tính trên fact Regime cũ
      (chi tiết correction lineage tại context.md §12).

  - provider_context_id: feature-engineering
    consumer_context_id: context-projection
    contract_id: feature-computed
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: feature-engineering
      downstream_context_id: context-projection
    translation_policy: conformist
    purpose: "authoritative as-of snapshot aggregation (atomic Feature value, sao chép nguyên vẹn) — Context KHÔNG tái sản xuất công thức Feature, xem ADR-014"

  - provider_context_id: feature-engineering
    consumer_context_id: context-projection
    contract_id: feature-fact-invalidated
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: feature-engineering
      downstream_context_id: context-projection
    translation_policy: conformist
    purpose: "authoritative as-of snapshot aggregation (Feature eligibility filtering, §8 Phase 1) — không phải Feature computation, xem ADR-014"
    consumer_obligation: >
      Consumer nhận FeatureFactInvalidated PHẢI invalidate hoặc recompute mọi MarketContextSnapshot
      fact có causal ancestry bao gồm FeatureComputed fact bị invalidate (bất kỳ trong ba founding
      feature type) — không được giữ nguyên giá trị đã tính trên fact Feature cũ (chi tiết
      correction lineage tại context.md §12).
