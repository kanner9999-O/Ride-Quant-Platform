  # Package 0.2-C6 (order.md v0.1) — Order originate từ đúng một Execution Intent eligible, tiêu
  # thụ published-language ExecutionIntentIssued (subject_ref/scope copy nguyên vẹn + causation_refs
  # trace-back, order.md §4) VÀ eligibility rule eligible_for_new_order_creation (execution-intent.md
  # §6a) — quan hệ cross-context THỰC SỰ tồn tại (khác precedent risk-gateway/strategy-decision:
  # KHÔNG edge, chỉ opaque ref: lookup), nên relationship edge MỚI cần đăng ký.
  - provider_context_id: risk-gateway
    consumer_context_id: order-management
    contract_id: execution-intent-issued
    relationship_type: published_language
    status: active
    model_influence:
      upstream_context_id: risk-gateway
      downstream_context_id: order-management
    translation_policy: conformist   # Order tiêu thụ trực tiếp canonical Execution Intent language, không cần anti-corruption layer
    consumer_obligation: >
      Consumer (Order) PHẢI resolve eligible_for_new_order_creation (execution-intent.md §6a) TRỰC
      TIẾP từ authoritative Execution Intent event stream TẠI order_context_cursor TRƯỚC khi Order
      creation mới — KHÔNG dùng ExecutionIntentCurrentView latest-state làm input (order.md §4a).

  # Package 0.2-C7 (execution-result.md/fill.md/position.md/replay-event.md v0.1) — ba edge nội bộ
  # chuỗi C7 (Order→ExecutionResult→Fill→Position) VÀ bảy edge cho replay-integration (mỗi
  # authoritative context mà ReplayStateProjection thực sự fold, replay-event.md §2) — TẤT CẢ đều
  # là published-language consumption THỰC SỰ (eligibility rule/causation_refs/direct fold), KHÔNG
