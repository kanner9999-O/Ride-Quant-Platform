# Gán Người/AI ↔ Role. Constitution KHÔNG được tham chiếu trực tiếp file này bằng tên riêng —
# chỉ tham chiếu qua Role. Đây là nơi DUY NHẤT lưu ai đang giữ role gì (Single Source of Truth — I-12).

members:
  - name: "Product Owner"          # tên thật điền khi cần, giữ placeholder trong bản public
    roles: ["Product Owner", "Chief Architect"]
    note: "Hiện tại 1 người giữ cả 2 role — có thể tách khi có Chief Architect riêng."

  - name: "ChatGPT"
    roles: ["AI Technical Architect"]
    focus: "Discovery, consistency-check giữa các Phase, roadmap tracking"

  - name: "Claude"
    roles: ["AI Technical Architect"]
    focus: "Documentation, thiết kế chi tiết, implementation, code review"
    aliases: ["Independent Review B"]
    alias_note: >
      "Independent Review B" là stable governance identifier cho đúng actor "Claude" khi hoạt động ở
      vai trò reviewer độc lập thứ hai (distinct từ vai trò authoring/execution chung của Claude, và
      distinct/không collapse vào "ChatGPT" — hai actor identity khác nhau tại cùng review boundary).
      KHÔNG phải một actor/AI riêng biệt, KHÔNG phải một nhân vật có thật được phát minh — chỉ là một
      alias registered cho cùng một actor "Claude" giữ role AI Technical Architect, dùng để pin reviewer
      evidence tại review boundary theo đúng historical label đã dùng tại ADR-012/ADR-013 và các Package
      review transaction (Chapter 0 §3, Chapter 11 §11.5: "hai actor identity khác nhau thực hiện" —
      ChatGPT là actor 1, Claude/"Independent Review B" là actor 2, thoả minimum-two-independent-
      reviewer requirement).

  - name: "Thạch"
    roles: ["Software Engineer"]
    module_owner: []              # điền tên Engine khi được assign, ví dụ ["Structure Engine"]

# Ghi chú: ChatGPT và Claude đều giữ role "AI Technical Architect" — NGANG HÀNG,
# không có "Lead" hay hệ thống cấp bậc giữa 2 AI. Quyết định chính thức: xem ADR-006.
