event_type: CANDLE_CLOSED
# candle.md v0.4 §2 event_types table (PAST_TENSE_UPPER_SNAKE per Chapter 3 §3.2, referenced not
# redefined here).

event_class: observation
# Governed-authored. Candle is authoritative market-data OBSERVATION, not a derived/computed
# analytical fact — the opposite category from feature-computed/regime-classified/structure events
# (already-established "derived_fact" precedent, feature-computed/v1.0.yaml), and definitionally not
# a Decision (candle.md's own envelope §2 never declares decision_time/decision_context_cursor,
# consistent with Chapter 8 §8.2.1/§8.4's Decision-specific cardinality rule not applying here).
# CandleClosed is the final, authoritative OHLCV observation for a completed market-data window
# (candle.md §4 description: "Quan sát OHLCV cuối cùng, authoritative, khi cửa sổ effective_time đã
# đóng") — it reports what the venue/ingestion adapter directly observed, not a value computed from
# other authoritative facts. This matches Chapter 8 §8.3.1's own worked illustrative example
# verbatim ("event_class: decision | observation | ...", `MARKET_DATA_OBSERVED`), which is
# explicitly open-ended, not a closed vocabulary — Chapter 0 §4b does not require an ADR merely to
# select an accurate, already-precedented descriptive label for a non-decision event.
#
# No new event_class vocabulary (e.g. a distinct "raw_observation"/"market_data" term) is needed:
# "observation" faithfully and completely describes CandleClosed without narrowing or overstating its
# semantic.

allowed_streams:
  - stream_id: market-data-ingestion-candle
# Governed-authored from docs/architecture/stream-registry.yaml (Genesis Registry, `status:
# Approved` v0.2, `registry_version: v1.0`) + Chapter 8 §8.3.1 ("Event Contract chỉ được tham chiếu
# stream, KHÔNG định nghĩa stream; eligibility khai báo MỘT CHIỀU tại Event Contract, KHÔNG ở Stream
# Registry"). `market-data-ingestion-candle` is market-data-ingestion's sole registered stream in the
# Genesis Registry (`writer_authority.module_id: market-data-ingestion`, `status: active`,
# `genesis_position: 0`) — the one-stream-per-writer-fact-family topology Approved ADR-036 v0.3
# fixes. `module-registry.yaml`'s own `market-data-ingestion` entry responsibilities text
# ("Quan sát và ghi nhận Candle observed/closed/corrected từ venue") confirms market-data-ingestion
# is the sole writer authority for all Candle events, CandleClosed included.

merge_constraints: {}
# Governed-authored per Chapter 8 §8.3.4's own authority split ("Input Contract sở hữu duy nhất
