# platform enum (e.g. a fabricated `none` value) is invented where current authority defines none.

payload_shape:
  state: {type: enum, value: CLOSED, required: true}
  open: {type: decimal, required: true}
  high: {type: decimal, required: true}
  low: {type: decimal, required: true}
  close: {type: decimal, required: true}
  volume: {type: decimal, required: true}
  data_quality: {type: enum, values: [complete, complete_zero_volume], required: true}

payload_semantics_and_invariants:
  description: >
    The final, authoritative OHLCV observation for a completed market-data window of one Logical
    Candle Subject (candle_subject_id — opaque, stable, resolved deterministically from exactly
    {instrument_id, venue_id, timeframe, window_start, window_end} per Chapter 6 §6.1/§6.8; domain
    logic must never parse it to infer scope fields). Marks the subject's transition to CLOSED —
    either from PROVISIONAL (the common path, after one or more CandleObserved) or directly from
    UNSEEN (valid for historical/closed-only ingestion — e.g. Backtest reading pre-closed vendor
    data with no prior provisional WS stream; a CandleObserved must never be fabricated merely to
    "pass through" PROVISIONAL first). Does not delete or overwrite any prior CandleObserved for the
    same subject, if any exist — those remain in the append-only log (I-3).
  subject_binding:
    subject_kind: entity
    subject_type: Candle
    scope_fields: [instrument_id, venue_id, timeframe, window_start, window_end]
    note: >
      envelope.subject_ref.subject_id (candle_subject_id) and envelope.subject_ref.scope carry this
      binding per Chapter 8 §8.2.2 — applied here, not redefined; envelope.effective_time equals the
      subject's own [window_start, window_end) interval and never changes across any observation or
      correction of the same subject.
  data_quality_semantics:
    complete: >
      Standard case — the venue/producer directly confirmed a completed window with observed
      trade/quote activity.
    complete_zero_volume: >
      Valid ONLY when ALL five of the following provenance conditions hold simultaneously (none may
      be inferred from silence): (1) the authoritative source/producer EXPLICITLY confirmed a
      completed, zero-volume window (the venue actually published "closed, no trade" — never
      inferred from an absence of messages); (2) envelope.producer_ref resolves to the exact producer
      that issued that confirmation in (1); (3) envelope.event_contract_ref resolves to an Event
      Contract version that permits `complete_zero_volume` for this exact contract_id (this v1.0
      version does); (4) envelope.source_identity is present whenever that source is capable of
      retry/redelivery (Chapter 6 §6.6), to support correct dedup of a repeated confirmation; (5) the
      ingestion adapter does NOT infer `complete_zero_volume` merely from receiving no trade/message
      in the window — silence is never proof of a confirmed zero-volume close. If no source assertion
      exists, no CandleClosed with `complete_zero_volume` may be emitted for that window at all — the
      window must instead be represented as a data-quality gap condition (a separate, optional event
      type, out of this artifact's own scope).
  precedence_and_uniqueness:
    rule: >
      Exactly one authoritative CandleClosed exists for a given Logical Candle Subject prior to any
      correction. A second, non-identical authoritative closed/correction source fact for the SAME
      subject must NEVER be appended as a second, independent CandleClosed event under any
      circumstance.
    resolution_summary: >
      When ingestion receives a closed or correction source fact for a subject already carrying an
      authoritative CandleClosed (or a subsequent CandleCorrected), it resolves an idempotency
      identity for the incoming fact (native source_identity, or a declared, deterministic,
      versioned fallback — Chapter 6 §6.6) and applies exactly one of: (a) identity unresolvable ->
      fail closed / quarantine, no CandleClosed appended, no dedup, no CandleCorrected emitted —
      absent provenance is never treated as evidence of a valid correction; (b) same identity, same
      payload -> duplicate delivery, zero additional business effect, no new event; (c) same
      identity, different payload -> provenance integrity violation, fail closed / quarantine — never
      silently reinterpreted as a correction; (d) different identity, same subject, authoritative
      value changed -> emit CandleCorrected (see candle-corrected/v1.0.yaml), never a second
      CandleClosed; (e) different identity, same payload -> duplicate-equivalent only if the source
      contract explicitly declares equivalence semantics, otherwise quarantine pending
      reconciliation. No branch of this resolution ever produces a second independent CandleClosed
      for the same subject — the full deterministic algorithm and its exact step ordering are owned
      by candle.md §11 (Domain Contract drafting provenance only; this summary is sufficient, and
      self-contained, for validating THIS event's own uniqueness invariant without consulting it).
  causation_ref_state_dependency_classification:
    classification: VACUOUS
    reason: "causation_refs is canonically [] for this root event"
    authority: >
      docs/project/context-upstream-state-dependency-derivation-001.md v0.4 §2.1 (Review A
      validated, CLEAN — 0/0/1, blob a8b10628f4c156f67b25d18868dec4d6434971d9), applying Chapter 8
      §8.2.3's causal-closure `dependency_authority: per_effect_event_contract` classification test
      per event_contract_ref. Not re-derived here — cited as already-reviewed authority.
  invariants:
    - "envelope.causation_refs MUST be exactly [] — explicit empty set, not absent (root event, Chapter 8 §8.2.1)."
    - "envelope.effective_time equals the subject's own [window_start, window_end) interval and is identical across every CandleObserved for the same subject, if any exist."
    - "payload.data_quality MUST be declared explicitly — never defaulted to `complete` when unconfirmed."
    - "payload.data_quality = complete_zero_volume is valid ONLY when all five provenance conditions above hold — see data_quality_semantics."
    - "A second, non-identical authoritative closed/correction source fact for the same subject MUST be represented via CandleCorrected (or one of the non-CandleClosed resolution branches above), never as a second independent CandleClosed — see precedence_and_uniqueness."
    - "This event does not itself carry any correction lineage reference — correction lineage begins at CandleCorrected (candle-corrected/v1.0.yaml), which this CandleClosed may later become the target of."

