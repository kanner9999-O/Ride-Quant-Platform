last_review: null

event_type: CHANGE_OF_CHARACTER_DETECTED
# structure.md v0.4 §2 event_types table (PAST_TENSE_UPPER_SNAKE per Chapter 3 §3.2, referenced not
# redefined here).

event_class: derived_fact
# Governed-authored. Identical reasoning and category as break-of-structure-detected/v1.0.yaml —
# NOT `decision` (no decision_time/decision_context_cursor anywhere in structure.md's own envelope
# §2); `derived_fact` reuses this repository's own already-established vocabulary (identical usage
# in feature-computed/v1.0.yaml, feature.md §2, regime.md §2, swing.md §2, structure.md §2). Not
# `observation`: ChangeOfCharacterDetected is a computed reversal conclusion, not a raw venue
# observation. Both BOS and CHoCH are Structure observation-family-adjacent derived facts sharing
# the same event_class value — correction/reversal lineage is expressed through event type,
# causation_refs, and payload semantics, not through a separate event_class value.

allowed_streams:
  - stream_id: structure-engine-structure
# Governed-authored from docs/architecture/stream-registry.yaml (Genesis Registry, `status:
# Approved`, `registry_version: v1.0`) + Chapter 8 §8.3.1. Same stream as
# break-of-structure-detected/v1.0.yaml — structure-engine's Structure fact family's own stream
# (`writer_authority.module_id: structure-engine`, `status: active`), per Approved ADR-036 v0.3's
# one-stream-per-fact-family topology. All four Structure event types share this one stream.

merge_constraints:
  prerequisite_policy: causation_must_resolve_before_apply
# Governed-authored per Chapter 8 §8.3.4's own authority split, identical reasoning to
# break-of-structure-detected/v1.0.yaml. structure.md v0.4 §2 envelope fixes `causation_refs` as
# never empty for any Structure event — every ChangeOfCharacterDetected must have its
# broken_swing_ref.swing_confirmed_event_ref AND breaking_candle_refs resolve before this event may
# be applied, per Chapter 8 §8.3.4's own P_causation/P_global DAG requirement.

payload_shape:
  prior_orientation: {type: enum, values: [BULLISH, BEARISH], required: true}
  new_orientation: {type: enum, values: [BULLISH, BEARISH], required: true}
  broken_swing_ref:
    type: object
    required: true
    description: "Revision-qualified reference to the Eligible Swing whose level was broken — canonical shape below, identical to break-of-structure-detected/v1.0.yaml."
    schema:
      swing_id: {type: string, required: true, description: "Logical Swing identity."}
      swing_revision: {type: integer, required: true, description: "Swing generation identity — a different revision of the same swing_id is an independently eligible pair."}
      swing_confirmed_event_ref: {type: event_record_ref, required: true, description: "Verification field — resolves and confirms the exact physical SwingConfirmed record for this (swing_id, swing_revision). Not re-read for its own payload content at apply time."}
      direction: {type: enum, values: [HIGH, LOW], required: true}
  breaking_candle_refs: {type: array, items: event_record_ref, required: true, description: "One or more candle-closed/candle-corrected facts providing the break evidence."}

payload_semantics_and_invariants:
  description: >
    Price breaks through an opposite-side Swing level, reversing the currently authoritative
    orientation (BULLISH -> BEARISH or BEARISH -> BULLISH). Requires a direct prior orientation of
    BULLISH or BEARISH — CHoCH is NEVER valid from UNDETERMINED or NEUTRAL (that case always uses
    BreakOfStructureDetected, break-of-structure-detected/v1.0.yaml). CHoCH changes the authoritative
    structure state IMMEDIATELY — no separate "candidate transition" state at this layer: the
    broken Swing level is already CONFIRMED and the breaking Candle is already authoritative at the
    moment this event fires, so there is no remaining uncertainty to wait on.
  subject_binding:
    subject_kind: entity
    subject_type: Structure
    scope_fields: [instrument_id, venue_id, timeframe, structure_definition_version]
    note: >
      envelope.subject_ref carries this binding per Chapter 8 §8.2.2, applied here not redefined —
      identical binding to break-of-structure-detected/v1.0.yaml (same one continuous subject per
      scope). envelope.effective_time equals the effective_time of the last Candle in
      breaking_candle_refs, NOT recorded_time.
  break_criterion:
    broken_level_decision_table: >
      When prior_orientation is BULLISH and new_orientation is BEARISH: broken_swing_ref.direction
      MUST be LOW. When prior_orientation is BEARISH and new_orientation is BULLISH:
      broken_swing_ref.direction MUST be HIGH. This is the structural opposite of a continuation
      BOS: a continuation BULLISH->BULLISH breaks a HIGH swing (continuing the existing direction);
      a CHoCH BULLISH->BEARISH breaks a LOW swing (the opposite-side level constituting the current
      uptrend) — not the same kind of level.
    price_basis_and_comparison: >
      The break test is configured by structure_definition_version.break_price_basis (`wick` or
      `close`) and structure_definition_version.comparison_policy (`strict` or `inclusive`) — no
      single school is hardcoded; one policy applies uniformly to both BreakOfStructureDetected and
      ChangeOfCharacterDetected within the same structure_definition_version (fixes
      STRUCT-EC-A-MAJ-02 — fully inlined here, not a pointer to
      break-of-structure-detected/v1.0.yaml). With `wick`+`strict`: HIGH break requires candle.high
      > broken_swing.pivot_price; LOW break requires candle.low < broken_swing.pivot_price. With
      `wick`+`inclusive`: >= / <=. With `close`+`strict`: candle.close > / < pivot_price. With
      `close`+`inclusive`: candle.close >= / <= pivot_price. An equal-high/equal-low touch is a
      break only under `inclusive`; under `strict` a touch does not break (valid absence, no
      event). Required confirmation uses only authoritative Candle facts
      (candle-closed/candle-corrected) — never a provisional observation.
  eligible_swing_constraint: >
    broken_swing_ref MUST reference a (swing_id, swing_revision) pair satisfying ALL seven of the
    following Eligible conditions simultaneously, at the cursor as of this event's own
    recorded_time (structure.md §6a, complete membership/validity predicate — fixes
    STRUCT-EC-A-MAJ-01): (1) a SwingConfirmed fact exists for the exact (swing_id, swing_revision)
    pair; (2) that SwingConfirmed is visible at the current cursor — no look-ahead; (3) it matches
    the required instrument_id/venue_id/timeframe, and its direction matches the
    broken_level_decision_table above; (4) it matches
    structure_definition_version.depends_on_swing_definition_version; (5) NO SwingInvalidated is
    visible for that exact (swing_id, swing_revision) pair at the cursor; (6) that exact pair has
    NOT already been used as the broken_swing_ref of another still-valid (not yet
    StructureFactInvalidated) BreakOfStructureDetected/ChangeOfCharacterDetected; (7) it is the
    latest still-valid revision of that swing_id at the cursor — no newer still-valid revision of
    the same swing_id may be skipped over in favor of an older one. Condition (7) operates per
    swing_id only — a different revision of a DIFFERENT swing_id (or of the same swing_id once a
    newer revision supersedes an older one) is always an independently eligible pair, never
    "locked" merely because some other revision was previously consumed under condition (6). When,
    after applying all seven conditions, more than one DISTINCT swing_id simultaneously has an
    Eligible pair, exactly one is selected by the deterministic total order inlined below
    (relevant_swing_total_order) — never ambiguously, never by an unstated producer convention.
  relevant_swing_total_order:
    # Inlined (fixes STRUCT-EC-A-MAJ-05) — self-contained, no reference to structure.md §6a or to
    # break-of-structure-detected/v1.0.yaml required to determine which Eligible candidate is the
    # winner when more than one distinct swing_id simultaneously satisfies
    # eligible_swing_constraint above. Identical rule to break-of-structure-detected/v1.0.yaml's
    # own relevant_swing_total_order — both BOS and CHoCH share the same §6a-defined total order.
    scope: >
      Applies only when, after eligible_swing_constraint's seven conditions above, more than one
      DISTINCT swing_id simultaneously has an Eligible (swing_id, swing_revision) pair. When
      exactly one Eligible pair exists, it is the winner trivially and this order is not needed to
      determine it.
    criteria:
      - {order: 1, field: "pivot_effective_time.window_start", direction: DESC, rationale: "the pivot nearest the cursor wins (\"nearest still-unbroken level\")"}
      - {order: 2, field: "SwingConfirmed.recorded_time", direction: ASC, rationale: "known earlier wins (T vs T+n)"}
      - {order: 3, field: "stream_ref.stream_id", direction: ASC, comparison: lexical, rationale: "establishes stream identity as the basis for comparing sequence at (5)"}
      - {order: 4, field: "stream_ref.registry_version", direction: ASC, comparison: lexical, rationale: "same stream_id but a different registry snapshot is still distinguishable (Chapter 8 §8.3.1)"}
      - {order: 5, field: sequence, direction: ASC, comparison: "numeric — ONLY meaningful within the exact stream identity already fixed by criteria 3 AND 4"}
      - {order: 6, field: swing_revision, direction: DESC, rationale: "when every business-time/stream criterion above ties, the latest valid revision wins"}
      - {order: 7, field: swing_id, direction: ASC, comparison: lexical, rationale: "pure technical tie-break"}
      - {order: 8, field: "SwingConfirmed.event_id", direction: ASC, comparison: lexical, rationale: "final technical tie-break"}
    algorithm: >
      Compare criteria 1 through 8 in exact order. The FIRST criterion with a differing value
      between two candidates decides the winner. Subsequent criteria are NOT evaluated. This is
      strict lexicographic comparison — there is no branch that "skips" a criterion other than
      stopping at the first one that already distinguishes the candidates.
    criterion_5_precondition: >
      `sequence` (criterion 5) is evaluated ONLY when criteria 3 AND 4 both already tie (same
      stream_id AND same registry_version) — this is a precondition for criterion 5 to be
      meaningful at all, never an exception that "jumps past" it. If criterion 3 differs, it alone
      decides and criteria 4-8 are never evaluated. If criterion 3 ties but criterion 4 differs, it
      alone decides and criteria 5-8 are never evaluated. Raw `sequence` values are NEVER compared
      across two different streams as if they formed one global order (Chapter 8 §8.3.3; ADR-009) —
      stopping at criterion 3 or 4 whenever they differ is the exact mechanism that prevents this,
      not a weakening of their own role as ordering criteria.
    worked_examples: >
      (1) A.stream_id=alpha, B.stream_id=beta: alpha < beta -> A wins at criterion 3; criteria 4-8
      not evaluated. (2) Same stream_id=alpha for both, A.registry_version=v1, B.registry_version=v2:
      v1 < v2 -> A wins at criterion 4; criteria 5-8 not evaluated. (3) Same stream_id=alpha, same
      registry_version=v1, A.sequence=100, B.sequence=105: criteria 3 and 4 tie, so criterion 5 is
      evaluated -> 100 < 105 -> A wins at criterion 5.
    duplicate_detection: >
      If all eight criteria values match exactly between two SwingConfirmed candidates being
      compared for this total order, they are duplicate representations of the same authoritative
      Swing fact — there is no ninth criterion. This is a distinct concern from this event's own
      computation-identity dedup, which governs whether two ChangeOfCharacterDetected computations
      are themselves duplicates — see computation_identity_and_dedup below.
    opaque_identifier_rule: >
      swing_id (criterion 7) and event_id (criterion 8) are pure technical tie-breaks, deterministic
      by string ordering of an opaque identifier, carrying no business meaning — opaque identifiers
      are never parsed to infer a timestamp or business semantic (Chapter 6 §6.8); string ordering
      is used only to guarantee a total order, never to interpret the identifier's content.
  computation_identity_and_dedup:
    # Inlined (fixes PUB-AGG-MAJ-01) — self-contained, no reference to structure.md §11 required to
    # validate this artifact's own payload. Structure is internally computed from Swing/Candle
    # evidence, never externally redelivered — there is no source_identity/retry-redelivery concept
    # (Chapter 6 §6.6) to dedup against; identity and dedup are computation-based, not
    # source-redelivery-based. Identical discipline to break-of-structure-detected/v1.0.yaml's own
    # computation_identity_and_dedup — both event types share the same structure.md §11 rule.
    computation_identity_tuple:
      - "structure_subject_id (envelope.subject_ref.subject_id)"
      - "event_type (CHANGE_OF_CHARACTER_DETECTED)"
      - "envelope.causation_refs, treated as a SET (order-independent) — broken_swing_ref.swing_confirmed_event_ref plus every breaking_candle_refs entry"
      - "the complete payload content above (prior_orientation, new_orientation, broken_swing_ref, breaking_candle_refs)"
    dedup_rule: >
      Two computations whose identity tuple above matches exactly are the SAME authoritative fact.
      Recomputation from unchanged, still-valid authoritative Swing/Candle input — e.g. a re-run
      after restart, or Live/Backtest/Replay independently recomputing the same Eligible pair — is
      idempotent and MUST NOT append a second ChangeOfCharacterDetected record for it.
    distinct_facts_not_duplicates: >
      A different broken_swing_ref, a different breaking_candle_refs set, or a different
      prior_orientation/new_orientation pair is never a duplicate of this fact merely because some
      other field happens to match — the identity tuple above compares the full payload and the
      complete causation_refs set, not a partial subset.
  invariants:
    - "envelope.causation_refs MUST contain exactly these two role contributions, and nothing else: broken_swing_ref.swing_confirmed_event_ref (exactly one); breaking_candle_refs (one or more) — see causal_state_dependency_declaration below for the canonical machine-readable classification of each."
    - "prior_orientation MUST be BULLISH or BEARISH — not valid on UNDETERMINED/NEUTRAL."
    - "new_orientation MUST be the exact opposite of prior_orientation (BULLISH<->BEARISH) — no third value."
    - "broken_swing_ref.direction MUST match the broken_level_decision_table above."
    - "envelope.effective_time = effective_time of the last Candle in breaking_candle_refs."
    - "Replay at a cursor before this event's own recorded_time MUST NOT observe it."
    - "This event is never overwritten in place — it may only later be negated via StructureFactInvalidated (structure-fact-invalidated/v1.0.yaml) with an explicit cause, never because price later moved differently."
    - "Two computations sharing an identical computation_identity_and_dedup tuple are the same authoritative fact — recomputation from unchanged input is idempotent and MUST NOT produce a second record (fixes PUB-AGG-MAJ-01; see computation_identity_and_dedup above)."

causal_state_dependency_declaration:
  mode: exhaustive
  roles:
    - role_id: broken_swing_confirmed_event_ref
      selector:
        kind: payload_field
        path:
          - broken_swing_ref
          - swing_confirmed_event_ref
      cardinality:
        exactly: 1
      classification: EXTERNAL_NON_STATE_CAUSE
      apply_time_requirement: >
        Authoritative application of ChangeOfCharacterDetected does not require re-reading the
        referenced SwingConfirmed's own payload (e.g. its pivot_price). swing_confirmed_event_ref is
        a verification field only — identity/existence/tuple-consistency proof that the pivot used
        as the broken level is a real, confirmed Swing fact. The pivot's own identity (swing_id,
        swing_revision, direction) is already materialized directly in this event's own
        broken_swing_ref; the conclusion (new_orientation) is separately and completely materialized
        in this event's own payload.
    - role_id: breaking_candle_refs
      selector:
        kind: payload_field
        path:
          - breaking_candle_refs
      cardinality:
        min: 1
        max: null
      classification: EXTERNAL_NON_STATE_CAUSE
      apply_time_requirement: >
        Authoritative application of ChangeOfCharacterDetected does not require re-reading the
        referenced Candle(s)' own OHLC values. This event's own payload never copies Candle OHLC —
        only the reference and the already-computed conclusion (new_orientation) are materialized.
        The breaking Candle reference(s) are required only for existence/precedence proof that a
        real, authoritative break-confirming fact exists.
# Approved ADR-048 (docs/adr/ADR-048.md) canonical mechanism. Two roles, exhaustive — identical
# shape to break-of-structure-detected/v1.0.yaml's own declaration, since both event types share
# the same two causation-ref categories (derivation v0.5 §2.3/§2.4, shared reasoning). Both roles
# EXTERNAL_NON_STATE_CAUSE — no STATE_DEPENDENCY role exists for this event type. Duplicate
# canonical-locator (stream_id, sequence) rejection within this event's own causation_refs is
# governed generically by Approved ADR-048's own validation algorithm — no Structure-specific
# duplicate-detection algorithm is defined here.

