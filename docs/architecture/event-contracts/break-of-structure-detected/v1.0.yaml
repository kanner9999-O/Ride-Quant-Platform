event_type: BREAK_OF_STRUCTURE_DETECTED
# structure.md v0.4 §2 event_types table (PAST_TENSE_UPPER_SNAKE per Chapter 3 §3.2, referenced not
# redefined here).

event_class: derived_fact
# Governed-authored. NOT `decision` (no decision_time/decision_context_cursor anywhere in
# structure.md's own envelope §2, consistent with Chapter 8 §8.2.1/§8.4's Decision-specific
# cardinality rule not applying here). `derived_fact` reuses this repository's own already-
# established vocabulary for exactly this event category — identical usage already in
# feature-computed/v1.0.yaml, feature.md §2, regime.md §2, swing.md §2, and structure.md §2 itself
# ("derived/computed fact, không phải quan sát trực tiếp venue"). Not `observation` (the Candle
# category): BreakOfStructureDetected is definitionally a computed conclusion — the producer reads
# Swing + Candle fact to DECIDE whether/how to emit it (structure.md §6) — never a raw venue
# observation. Chapter 8 §8.3.1's own worked `event_class` example is explicitly open-ended; no new
# architecture decision is required to select an accurate, already-precedented label.

allowed_streams:
  - stream_id: structure-engine-structure
# Governed-authored from docs/architecture/stream-registry.yaml (Genesis Registry, `status:
# Approved`, `registry_version: v1.0`) + Chapter 8 §8.3.1 ("Event Contract chỉ được tham chiếu
# stream, KHÔNG định nghĩa stream; eligibility khai báo MỘT CHIỀU tại Event Contract"). structure-
# engine owns exactly TWO registered streams in the Genesis Registry: `structure-engine-swing`
# (Swing fact family, not this contract's concern) and `structure-engine-structure`
# (`writer_authority.module_id: structure-engine`, `status: active`, `genesis_position: 0`) — the
# Structure fact family's own stream, per Approved ADR-036 v0.3's one-stream-per-fact-family
# topology. All four Structure event types (BreakOfStructureDetected, ChangeOfCharacterDetected,
# StructureFactInvalidated, StructureRecomputed) share this one stream, since they are one fact
# family (structure.md §1 — one continuous Logical Structure Subject per scope).

merge_constraints:
  prerequisite_policy: causation_must_resolve_before_apply
# Governed-authored per Chapter 8 §8.3.4's own authority split ("Input Contract sở hữu duy nhất
# final merge policy — Event Contract KHÔNG định nghĩa merge order") and worked example (identical
# value already reused by feature-computed/v1.0.yaml, candle-corrected/v1.0.yaml).
# structure.md v0.4 §2 envelope fixes `causation_refs` as never empty for any Structure event — every
# BreakOfStructureDetected must have its broken_swing_ref.swing_confirmed_event_ref AND
# breaking_candle_refs resolve before this event may be applied, per Chapter 8 §8.3.4's own
# P_causation/P_global DAG requirement (cause ≺ effect). No additional Structure-specific merge
# constraint beyond this baseline was identified — recorded_time ordering and Eligible-Swing
# per-pair non-reuse are already fully captured as payload/envelope invariants below, not as a
# cross-stream merge constraint.

payload_shape:
  prior_orientation: {type: enum, values: [UNDETERMINED, NEUTRAL, BULLISH, BEARISH], required: true}
  new_orientation: {type: enum, values: [BULLISH, BEARISH], required: true}
  broken_swing_ref:
    type: object
    required: true
    description: "Revision-qualified reference to the Eligible Swing whose level was broken — canonical shape below."
    schema:
      swing_id: {type: string, required: true, description: "Logical Swing identity."}
      swing_revision: {type: integer, required: true, description: "Swing generation identity — a different revision of the same swing_id is an independently eligible pair."}
      swing_confirmed_event_ref: {type: event_record_ref, required: true, description: "Verification field — resolves and confirms the exact physical SwingConfirmed record for this (swing_id, swing_revision). Not re-read for its own payload content at apply time."}
      direction: {type: enum, values: [HIGH, LOW], required: true}
  breaking_candle_refs: {type: array, items: event_record_ref, required: true, description: "One or more candle-closed/candle-corrected facts providing the break evidence."}

payload_semantics_and_invariants:
  description: >
    Price breaks through a specific Swing level in a direction that either continues an existing
    orientation or establishes one for the first time (BULLISH or BEARISH) — NEVER produces
    NEUTRAL. `prior_orientation` may be UNDETERMINED, NEUTRAL, BULLISH, or BEARISH;
    `new_orientation` is always BULLISH or BEARISH. The executable break criterion is identical
    regardless of what `prior_orientation` is — only the interpretation (first establishment vs.
    continuation) differs, which is why no separate event type exists for "first establishment."
  subject_binding:
    subject_kind: entity
    subject_type: Structure
    scope_fields: [instrument_id, venue_id, timeframe, structure_definition_version]
    note: >
      envelope.subject_ref carries this binding per Chapter 8 §8.2.2, applied here not redefined.
      Structure has exactly ONE continuous subject per qualifying scope — unlike Candle (subject per
      window) or Swing (subject per pivot) — the subject never "ends" and a new one begins; it
      evolves through the subject's entire lifecycle via this event, ChangeOfCharacterDetected, and
      StructureRecomputed. envelope.effective_time equals the effective_time of the last Candle in
      breaking_candle_refs (see break_criterion below), NOT recorded_time.
  break_criterion:
    broken_level_decision_table: >
      When prior_orientation is UNDETERMINED or NEUTRAL and new_orientation is BULLISH:
      broken_swing_ref.direction MUST be HIGH. When new_orientation is BEARISH: direction MUST be
      LOW. When prior_orientation is BULLISH and new_orientation is BULLISH (continuation):
      direction MUST be HIGH. When prior_orientation is BEARISH and new_orientation is BEARISH
      (continuation): direction MUST be LOW. prior_orientation BULLISH/BEARISH with a DIFFERING
      new_orientation is NEVER valid on this event type — that is ChangeOfCharacterDetected
      (change-of-character-detected/v1.0.yaml), not this event.
    price_basis_and_comparison: >
      The break test is configured by structure_definition_version.break_price_basis (`wick` or
      `close`) and structure_definition_version.comparison_policy (`strict` or `inclusive`) — no
      single school is hardcoded. With `wick`+`strict`: HIGH break requires candle.high >
      broken_swing.pivot_price; LOW break requires candle.low < broken_swing.pivot_price. With
      `wick`+`inclusive`: >= / <=. With `close`+`strict`: candle.close > / < pivot_price. With
      `close`+`inclusive`: candle.close >= / <= pivot_price. An equal-high/equal-low touch is a break
      only under `inclusive`; under `strict` a touch does not break (valid absence, no event).
      Required confirmation uses only authoritative Candle facts (candle-closed/candle-corrected) —
      never a provisional observation.
  eligible_swing_constraint: >
    broken_swing_ref MUST reference a (swing_id, swing_revision) pair satisfying ALL seven of the
    following Eligible conditions simultaneously, at the cursor as of this event's own
    recorded_time (structure.md §6a, complete membership/validity predicate — fixes
    STRUCT-EC-A-MAJ-01): (1) a SwingConfirmed fact exists for the exact (swing_id, swing_revision)
    pair; (2) that SwingConfirmed is visible at the current cursor — no look-ahead; (3) it matches
    the required instrument_id/venue_id/timeframe, and its direction matches the
    broken_level_decision_table above; (4) it matches
    structure_definition_version.depends_on_swing_definition_version; (5) NO SwingInvalidated is
    visible for that exact (swing_id, swing_revision) pair at the cursor; (6) that exact pair has
    NOT already been used as the broken_swing_ref of another still-valid (not yet
    StructureFactInvalidated) BreakOfStructureDetected/ChangeOfCharacterDetected; (7) it is the
    latest still-valid revision of that swing_id at the cursor — no newer still-valid revision of
    the same swing_id may be skipped over in favor of an older one. Condition (7) operates per
    swing_id only — a different revision of a DIFFERENT swing_id (or of the same swing_id once a
    newer revision supersedes an older one) is always an independently eligible pair, never
    "locked" merely because some other revision was previously consumed under condition (6). When,
    after applying all seven conditions, more than one DISTINCT swing_id simultaneously has an
    Eligible pair, which one a producer selects among them is resolved by a total-order tie-break
    rule that is a producer-side selection concern (full step-by-step mechanics remain
    structure.md §6a's own drafting-history content) — validating this already-emitted event's own
    payload requires only that the referenced pair satisfy all seven conditions above, never a
    re-derivation of which candidate was selected among several.
  invariants:
    - "envelope.causation_refs MUST contain exactly these two role contributions, and nothing else: broken_swing_ref.swing_confirmed_event_ref (exactly one); breaking_candle_refs (one or more) — see causal_state_dependency_declaration below for the canonical machine-readable classification of each."
    - "broken_swing_ref.direction MUST match the broken_level_decision_table above for the declared prior_orientation/new_orientation pair."
    - "new_orientation != prior_orientation is NEVER valid on this event when prior_orientation is BULLISH or BEARISH — that case is ChangeOfCharacterDetected, not this event."
    - "envelope.effective_time = effective_time of the last Candle in breaking_candle_refs."
    - "Replay at a cursor before this event's own recorded_time MUST NOT observe it — no backfilling a BOS as if known earlier than it actually was computed."
    - "This event is never overwritten in place — it may only later be negated via StructureFactInvalidated (structure-fact-invalidated/v1.0.yaml) with an explicit cause, never because price later moved differently (that is always a new, independent BOS/CHoCH)."

causal_state_dependency_declaration:
  mode: exhaustive
  roles:
    - role_id: broken_swing_confirmed_event_ref
      selector:
        kind: payload_field
        path:
          - broken_swing_ref
          - swing_confirmed_event_ref
      cardinality:
        exactly: 1
      classification: EXTERNAL_NON_STATE_CAUSE
      apply_time_requirement: >
        Authoritative application of BreakOfStructureDetected does not require re-reading the
        referenced SwingConfirmed's own payload (e.g. its pivot_price). swing_confirmed_event_ref is
        a verification field only — identity/existence/tuple-consistency proof that the pivot used
        as the broken level is a real, confirmed Swing fact. The pivot's own identity (swing_id,
        swing_revision, direction) is already materialized directly in this event's own
        broken_swing_ref; the conclusion (new_orientation) is separately and completely materialized
        in this event's own payload.
    - role_id: breaking_candle_refs
      selector:
        kind: payload_field
        path:
          - breaking_candle_refs
      cardinality:
        min: 1
        max: null
      classification: EXTERNAL_NON_STATE_CAUSE
      apply_time_requirement: >
        Authoritative application of BreakOfStructureDetected does not require re-reading the
        referenced Candle(s)' own OHLC values. This event's own payload never copies Candle OHLC —
        only the reference and the already-computed conclusion (new_orientation) are materialized.
        The breaking Candle reference(s) are required only for existence/precedence proof that a
        real, authoritative break-confirming fact exists.
# Approved ADR-048 (docs/adr/ADR-048.md) canonical mechanism. Two roles, exhaustive: every
# causation_refs entry is either the Eligible Swing's verification reference (exactly one) or one of
# the breaking Candle references (one or more) — together they exhaustively account for this
# event's own causation_refs set, matching the payload_semantics_and_invariants.invariants above
# exactly. Both roles are EXTERNAL_NON_STATE_CAUSE — no STATE_DEPENDENCY role exists for this event
# type (derivation v0.5 §2.3). Duplicate canonical-locator (stream_id, sequence) rejection within
# this event's own causation_refs is governed generically by Approved ADR-048's own validation
# algorithm — no Structure-specific duplicate-detection algorithm is defined here.

