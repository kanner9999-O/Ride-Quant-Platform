contract_id: candle-corrected
contract_version: v1.0
status: Draft
reviewers: []
approved_by: null
approved_at: null
last_review: null

event_type: CANDLE_CORRECTED
# candle.md v0.4 §2 event_types table (PAST_TENSE_UPPER_SNAKE per Chapter 3 §3.2, referenced not
# redefined here).

event_class: observation
# Governed-authored. CandleCorrected is a LATER, corrected authoritative OBSERVATION for the SAME
# Candle subject/window (candle.md §5 description: "Sửa một CandleClosed... đã publish, khi venue
# gửi correction muộn") — it is not a derived analytical computation over other authoritative facts
# (unlike feature-computed/regime-classified/structure events, which read multiple upstream facts to
# produce a new conclusion), and it is definitionally not a Decision (no decision_time/
# decision_context_cursor anywhere in candle.md's own envelope §2). The correction still originates
# from the venue/producer's own observation of the market-data window — it replaces a prior
# observation with a corrected one of the SAME underlying fact, never computing a new value from
# other domain facts. This is the identical event_class as candle-closed/v1.0.yaml — both are Candle
# observation events, differing only in whether they are the first or a later authoritative
# observation for the subject; correction lineage itself is expressed through event type (this one),
# `causation_refs`, and payload semantics below, not through a separate `event_class` value.
#
# No new platform-wide event_class vocabulary (e.g. "correction" or "observation_correction") is
# introduced: `observation` already faithfully and completely describes CandleCorrected without a new
# term, consistent with Chapter 8 §8.3.1's own open-ended `event_class` worked example.

allowed_streams:
  - stream_id: market-data-ingestion-candle
# Governed-authored from docs/architecture/stream-registry.yaml (Genesis Registry, `status:
# Approved` v0.2, `registry_version: v1.0`) + Chapter 8 §8.3.1 ("Event Contract chỉ được tham chiếu
# stream, KHÔNG định nghĩa stream; eligibility khai báo MỘT CHIỀU tại Event Contract, KHÔNG ở Stream
# Registry"). `market-data-ingestion-candle` is market-data-ingestion's sole registered stream in the
# Genesis Registry (`writer_authority.module_id: market-data-ingestion`, `status: active`,
# `genesis_position: 0`) — same one-writer-one-fact-family stream as candle-closed/v1.0.yaml, per
# Approved ADR-036 v0.3's topology (all Candle event types share this one fact family, one stream).

merge_constraints:
  prerequisite_policy: causation_must_resolve_before_apply
# Governed-authored per Chapter 8 §8.3.4's own authority split ("Input Contract sở hữu duy nhất
# final merge policy — Event Contract KHÔNG định nghĩa merge order; nếu một họ event có yêu cầu
# riêng, Event Contract chỉ khai báo constraint") and worked example (identical
# `prerequisite_policy: causation_must_resolve_before_apply` value shown for
# ARBITRAGE_DECISION_CREATED, and already reused identically by feature-computed/v1.0.yaml).
# candle.md v0.4 §5 fixes `causation_refs` as the ONE exception to Candle's root-event pattern
# ("ngoại lệ duy nhất: causation_refs KHÔNG rỗng") — every CandleCorrected must point exactly to the
# fact it corrects, and that direct corrected fact must resolve before this event may be applied, per
# Chapter 8 §8.3.4's own P_causation/P_global DAG requirement (cause ≺ effect). No additional
# Candle-specific merge constraint beyond this baseline was identified: recorded_time ordering and
# same-subject/same-window invariants are already fully captured as payload/envelope invariants
# below, not as a cross-stream merge constraint Input Contract would need beyond standard
# causal-topological ordering.

payload_shape:
  state: {type: enum, value: CLOSED, required: true}
  open: {type: decimal, required: true}
  high: {type: decimal, required: true}
  low: {type: decimal, required: true}
  close: {type: decimal, required: true}
  volume: {type: decimal, required: true}
  correction_reason: {type: string, required: false}

payload_semantics_and_invariants:
  description: >
    A NEW event correcting a CandleClosed or a prior CandleCorrected already published for the SAME
    Logical Candle Subject, when the venue delivers a corrected authoritative value after the fact
    (candle.md's own example: a 10:00 candle corrected at 10:07). Does NOT mutate the original
    record — append-only (I-3). Does NOT move the subject out of CLOSED; it is a self-transition
    CLOSED -> CLOSED (candle.md §1), replacing the fact currently in effect for query/projection
    purposes only, never rewriting history. This is also the mandatory representation for a second,
    non-identical authoritative closed source fact for the same subject — such a fact is NEVER
    appended as a second independent CandleClosed (see candle-closed/v1.0.yaml's own
    precedence_and_uniqueness section); it must always be represented as CandleCorrected instead.
  subject_binding:
    subject_kind: entity
    subject_type: Candle
    scope_fields: [instrument_id, venue_id, timeframe, window_start, window_end]
    note: >
      envelope.subject_ref carries this binding per Chapter 8 §8.2.2, applied here not redefined.
      envelope.subject_ref.subject_id (candle_subject_id) and every scope field MUST be identical to
      the fact being corrected — a correction never targets a different window or subject; changing
      any of the five qualifying scope fields identifies a DIFFERENT Logical Candle Subject entirely
      (candle.md §1), never a correction of the current one.
  causation_and_lineage:
    rule: >
      envelope.causation_refs MUST contain exactly ONE event_record_ref — never zero, never more
      than one (fixes CANDLE-EC-A-MIN-01; mirrors ADR-048's canonical role cardinality
      `cardinality: {exactly: 1}` below exactly — the narrative invariant and the machine-readable
      enforcement agree). That one reference MUST target the CandleClosed or CandleCorrected event
      currently authoritative for this subject at the moment this correction is emitted — the current
      authoritative Candle lineage head for the same Logical Candle Subject — never a fact that has
      already itself been superseded (no skipping an already-superseded predecessor in the correction
      lineage). This is the one explicit exception to Candle's root-event pattern (candle.md §5). The
      target MUST belong to the same Logical Candle Subject/window as this correction (see
      subject_binding below); Chapter 8 §8.2.3 tuple consistency still applies to the reference;
      merge_constraints.prerequisite_policy above requires the corrected target to resolve before
      this event may be applied.
    provenance_requirement: >
      A correction requires its own distinguishable provenance — either a genuinely different,
      resolvable source identity (Chapter 6 §6.6) from the fact it corrects, or an explicitly
      source-contract-declared correction identity (e.g. a venue-issued amendment code). Absent
      distinguishable provenance, the incoming fact must be treated per candle-closed/v1.0.yaml's own
      precedence_and_uniqueness resolution (duplicate / fail-closed / quarantine), never emitted as a
      CandleCorrected merely on suspicion of a correction.
  temporal_and_replay_semantics:
    effective_time: >
      envelope.effective_time (the subject's [window_start, window_end) interval) is IDENTICAL to
      the fact being corrected — a correction describes the same window again, it never creates a new
      one, and the subject's candle_subject_id never changes.
    recorded_time_ordering: >
      envelope.recorded_time MUST be strictly later than the recorded_time of the fact currently
      being corrected — a correction cannot be recorded before the fact it corrects existed.
    no_look_ahead: >
      Replay at any cursor positioned before this correction's own recorded_time MUST NOT observe
      this CandleCorrected (Chapter 5 §5.1/§5.3 anti-look-ahead) — a replay run bounded before this
      event's recorded_time sees only the fact being corrected, exactly as Live would have at that
      same point in time.
  append_only_and_state:
    no_mutation: >
      This is a new, independent event record. No mechanism anywhere mutates or removes the original
      CandleClosed/CandleCorrected being corrected — it remains permanently in the append-only log
      (I-3), available for audit/no-repaint verification.
    state_invariant: >
      payload.state is always CLOSED — a correction never produces a different subject state; the
      Logical Candle Subject's own state machine self-transitions CLOSED -> CLOSED for every
      correction (candle.md §1), it never re-enters PROVISIONAL or any other state.
  invariants:
    - "envelope.causation_refs MUST contain exactly one event_record_ref, targeting the current authoritative Candle lineage head for this subject — never zero, never more than one (see causation_and_lineage)."
    - "envelope.effective_time is identical to the fact being corrected — see temporal_and_replay_semantics."
    - "envelope.recorded_time is strictly later than the corrected fact's own recorded_time — see temporal_and_replay_semantics."
    - "Replay before this event's recorded_time never observes it — see no_look_ahead."
    - "This event never mutates the original record; the original remains in the append-only log — see append_only_and_state."
    - "payload.state is always CLOSED, never any other value — see append_only_and_state."
    - "envelope.subject_ref (subject_id and all five scope fields) is identical to the fact being corrected — see subject_binding."
    - "This is the sole valid representation for a second, non-identical authoritative closed source fact for the same subject — never a second independent CandleClosed."

causal_state_dependency_declaration:
  mode: exhaustive
  roles:
    - role_id: corrected_fact
      selector:
        kind: by_target
        match:
          event_types: [CANDLE_CLOSED, CANDLE_CORRECTED]
          contract_ids: [candle-closed, candle-corrected]
      cardinality:
        exactly: 1
      classification: EXTERNAL_NON_STATE_CAUSE
      apply_time_requirement: >
        Authoritative application of CandleCorrected does not require re-reading the corrected
        predecessor's domain payload/state. The effect carries the complete replacement OHLCV/state
        itself. The predecessor is required for identity, existence, lineage, tuple consistency, and
        causal precedence only.
# Approved ADR-048 (docs/adr/ADR-048.md) canonical mechanism — exactly one role, matching this
# event's own exactly-one causation cardinality (see causation_and_lineage above). The `by_target`
# static `match` selector targets the current authoritative Candle lineage head by envelope
# identity/pinned event_contract_ref only — target domain payload is never read. Duplicate
# canonical-locator (stream_id, sequence) rejection within one event's own causation_refs is governed
# generically by Approved ADR-048's own validation algorithm; naturally satisfied here, since the
# cardinality is exactly one entry — no Candle-specific duplicate-detection algorithm is defined.
# Classification semantic evidence: docs/project/context-upstream-state-dependency-derivation-001.md
# v0.5 §2.2 (corrected-fact reference: EXTERNAL_NON_STATE_CAUSE). This Draft candidate's declaration
# is not itself authoritative until this artifact is Published.

