contract_id: structure-recomputed
contract_version: v1.0
status: Draft
reviewers: []
approved_by: null
approved_at: null
last_review: null

event_type: STRUCTURE_RECOMPUTED
# structure.md v0.4 §2 event_types table (PAST_TENSE_UPPER_SNAKE per Chapter 3 §3.2, referenced not
# redefined here).

event_class: derived_fact
# Governed-authored. NOT `decision` (no decision_time/decision_context_cursor anywhere in
# structure.md's own envelope §2). `derived_fact` reuses this repository's own already-established
# vocabulary for exactly this event category (identical usage in feature-computed/v1.0.yaml,
# feature.md §2, regime.md §2, swing.md §2, structure.md §2 itself). StructureRecomputed is the
# event type that establishes the new authoritative orientation after a cascade — a computed
# conclusion from refolding Swing/Candle facts, never a raw venue observation.

allowed_streams:
  - stream_id: structure-engine-structure
# Governed-authored from docs/architecture/stream-registry.yaml (Genesis Registry, `status:
# Approved`, `registry_version: v1.0`) + Chapter 8 §8.3.1. Same stream as the other three Structure
# event types — structure-engine's Structure fact family's own stream, per Approved ADR-036 v0.3's
# one-stream-per-fact-family topology.

merge_constraints:
  prerequisite_policy: causation_must_resolve_before_apply
# Governed-authored per Chapter 8 §8.3.4's own authority split. structure.md v0.4 §2 envelope fixes
# `causation_refs` as never empty for any Structure event — every StructureRecomputed's entire
# StructureFactInvalidated cascade set must resolve before this event may be applied, per Chapter 8
# §8.3.4's own P_causation/P_global DAG requirement.

payload_shape:
  resulting_orientation: {type: enum, values: [NEUTRAL, BULLISH, BEARISH], required: true}
  justifying_fact_ref: {type: event_record_ref, required: false, description: "REQUIRED when resulting_orientation != NEUTRAL; PROHIBITED when resulting_orientation = NEUTRAL — see invariants."}
  input_cursor_ref:
    type: replay_cursor
    required: true
    description: >
      Canonical Chapter 8 §8.5 Replay Cursor, applied here, NOT redefined (fixes
      STRUCT-EC-A-MAJ-04 — disposition reversed from CORR-001's own STOP, see header). Pins the
      exact cursor/input set (still-valid Swing + Candle facts) used to refold resulting_orientation,
      deterministic enough to reproduce it. Shape owned by Chapter 8 §8.5.1: recorded_time
      (required), input_contract_ref (required, {contract_id, contract_version}),
      stream_registry_version (required), lifecycle_frontier (required, {stream_id, position:
      {kind, sequence}}), stream_positions (required, map stream_id -> sequence).
      input_contract_ref pins a Structure-scoped Input Contract instance (Chapter 8 §8.3.4). This
      reference, and stream_registry_version/lifecycle_frontier, MUST each resolve, per Chapter 8
      §8.1.1, to their own current governing authoritative artifact — an unresolvable reference, or
      one that resolves to content failing its own required validation, is a fail-closed condition.
      This artifact does not assert whether a Structure-scoped Input Contract currently exists in
      this repository, only that resolution/validation must succeed for the cursor to be usable as
      evidence (the still-missing Structure-scoped Input Contract is an operational prerequisite for
      resolvability, not a reason to withhold this representation — see header).

payload_semantics_and_invariants:
  description: >
    The AUTHORITATIVE fact establishing the NEW current_orientation after a cascade of one or more
    StructureFactInvalidated (structure-fact-invalidated/v1.0.yaml) has fully completed — the ONE
    event type that changes current_orientation in the correction flow (symmetric to the normal
    flow, where BreakOfStructureDetected/ChangeOfCharacterDetected transition orientation directly).
    Always arises AFTER every fact affected by the cascade has already received its own
    StructureFactInvalidated — there is no "partial" StructureRecomputed. resulting_orientation is
    determined by directly refolding every still-valid Swing/Candle fact at input_cursor_ref — it
    can be NEUTRAL (no fact justifies any direction) or BULLISH/BEARISH (a still-valid fact, or a
    re-derived chain from input, still justifies that direction).
  cascade_semantics:
    # Inlined (fixes STRUCT-EC-A-MAJ-06) — self-contained, no reference to structure.md §10
    # required to determine cascade root/membership/completion/causation-set completeness for this
    # artifact's own payload.
    cascade_root: >
      A cascade's ROOT is its direct invalidated ancestor — the first BreakOfStructureDetected/
      ChangeOfCharacterDetected to receive a StructureFactInvalidated in this cascade, caused
      directly by an upstream SwingInvalidated or CandleCorrected (structure-fact-invalidated/v1.0.yaml
      invalidation_cause: swing_invalidated or breaking_candle_corrected). Every other
      StructureFactInvalidated in the same cascade is a DESCENDANT of this root.
    dependency_forward_membership: >
      A fact E(k+1) is a dependency-forward DESCENDANT of fact E(k) in the same cascade when and
      only when E(k+1).prior_orientation equals exactly E(k).new_orientation in the original
      orientation chain (the BOS/CHoCH sequence as it was originally emitted, BEFORE any
      invalidation) — determined by this dependency graph, NEVER by the recorded_time order in
      which the invalidations themselves are later emitted. Membership in the cascade is exactly
      the root plus every fact transitively reachable by this forward relation from the root.
    direct_vs_chained_relation: >
      The cascade's root StructureFactInvalidated carries invalidation_cause ∈ {swing_invalidated,
      breaking_candle_corrected} (structure-fact-invalidated/v1.0.yaml), with causation_refs
      pointing to the root's own invalidated_fact_ref plus the direct upstream cause
      (SwingInvalidated/CandleCorrected). Every subsequent (descendant) StructureFactInvalidated in
      the same cascade carries invalidation_cause = chained_invalidation, with causation_refs
      pointing to its own invalidated_fact_ref plus the StructureFactInvalidated immediately
      preceding it in this cascade (its dependency-forward predecessor per
      dependency_forward_membership above) — never a SwingInvalidated/CandleCorrected directly, and
      never skipping to an earlier ancestor.
    completion_condition: >
      A cascade is COMPLETE once every fact in its membership set (cascade_root plus every
      transitive dependency-forward descendant, per dependency_forward_membership above) has
      received its own StructureFactInvalidated — no member of the membership set may remain
      un-invalidated. This StructureRecomputed MUST NOT be emitted before completion; there is no
      "partial" StructureRecomputed for a still-incomplete cascade.
    causation_set_completeness: >
      This event's own envelope.causation_refs MUST equal exactly the complete set of
      StructureFactInvalidated belonging to the completed cascade (cascade_root plus every
      transitive descendant) — no member omitted, no fact from a DIFFERENT cascade included. See
      the invariants below and causal_state_dependency_declaration's cascade_invalidations role,
      which mechanically enforces non-empty cardinality for this set.
    exactly_one_per_cascade: >
      Exactly one StructureRecomputed is emitted for a completed cascade — never more than one for
      the same invalidation set (see invariants below; unchanged from the pre-correction
      declaration).
  invariants:
    - "envelope.causation_refs MUST point to every StructureFactInvalidated belonging to the same cascade (cascade_root plus every transitive dependency-forward descendant, per cascade_semantics above) — none affected by the cascade may be omitted from causation, and no fact from a different cascade may be included — see causal_state_dependency_declaration below for the canonical machine-readable classification."
    - "resulting_orientation MUST be one of {NEUTRAL, BULLISH, BEARISH} — NEVER UNDETERMINED (once a fact has existed and been invalidated, the minimum valid conclusion is NEUTRAL, never a regression to the notional UNDETERMINED starting point)."
    - "justifying_fact_ref is REQUIRED when resulting_orientation is BULLISH or BEARISH — MUST reference a still-valid (not yet StructureFactInvalidated) BreakOfStructureDetected/ChangeOfCharacterDetected directly justifying that direction; it is PROHIBITED when resulting_orientation is NEUTRAL (no surviving fact justifies any direction — that is precisely what NEUTRAL means)."
    - "input_cursor_ref is REQUIRED on every resulting_orientation, including NEUTRAL — canonical Chapter 8 §8.5 Replay Cursor (fixes STRUCT-EC-A-MAJ-04), pinning the exact cursor/input set used to refold this result, sufficient to deterministically reproduce it."
    - "input_cursor_ref.recorded_time MUST be <= envelope.recorded_time of this exact StructureRecomputed (Cursor → Fact, Chapter 8 §8.5.2) — a fact claiming to have refolded as-of a cursor AFTER its own recorded_time is invalid."
    - "This StructureRecomputed MUST NOT be emitted before cascade completion_condition above holds — no partial StructureRecomputed for an incomplete cascade."
    - "envelope.recorded_time MUST be strictly later than the recorded_time of the last StructureFactInvalidated in the cascade."
    - "Exactly ONE StructureRecomputed is emitted per cascade — never more than one for the same invalidation set."
    - "This event does not delete or overwrite any prior output — it is an additional append-only fact (I-3)."
    - "Replay at a cursor before this event's own recorded_time MUST NOT observe it."

causal_state_dependency_declaration:
  mode: exhaustive
  roles:
    - role_id: cascade_invalidations
      selector:
        kind: by_target
        match:
          event_types: [STRUCTURE_FACT_INVALIDATED]
          contract_ids: [structure-fact-invalidated]
      cardinality:
        min: 1
        max: null
      classification: EXTERNAL_NON_STATE_CAUSE
      apply_time_requirement: >
        Authoritative application of StructureRecomputed does not require re-reading any referenced
        StructureFactInvalidated's own payload content — none of those references carry orientation
        data at all. This event's own resulting_orientation is computed by refolding Swing/Candle
        facts pinned via payload.input_cursor_ref — a mechanism entirely separate from
        causation_refs. The referenced StructureFactInvalidated set is required only as completeness
        proof that the cascade's invalidation set is fully committed before recomputing.
# Approved ADR-048 (docs/adr/ADR-048.md) canonical mechanism. One role, exhaustive: every
# causation_refs entry is a StructureFactInvalidated belonging to the same cascade — matching
# payload_semantics_and_invariants.invariants above exactly (causation_refs MUST point to every
# cascade member, never omitting one). Classification EXTERNAL_NON_STATE_CAUSE — no
# STATE_DEPENDENCY role exists for this event type (derivation v0.5 §2.6); resulting_orientation is
# computed via input_cursor_ref refold, never from the causation_refs targets' own payload. The
# `by_target` static-match selector targets the referenced events by envelope identity/pinned
# event_contract_ref only — target domain payload is never read. Duplicate canonical-locator
# (stream_id, sequence) rejection within this event's own causation_refs is governed generically by
# Approved ADR-048's own validation algorithm — no Structure-specific duplicate-detection algorithm
# is defined here.

compatibility_commitment: backward_only
# Approved ADR-047 (docs/adr/ADR-047.md), Product Owner decision "APPROVE ADR-047"
