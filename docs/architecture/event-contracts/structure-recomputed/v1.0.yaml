contract_id: structure-recomputed
contract_version: v1.0
status: Draft
reviewers: []
approved_by: null
approved_at: null
last_review: null

event_type: STRUCTURE_RECOMPUTED
# structure.md v0.4 §2 event_types table (PAST_TENSE_UPPER_SNAKE per Chapter 3 §3.2, referenced not
# redefined here).

event_class: derived_fact
# Governed-authored. NOT `decision` (no decision_time/decision_context_cursor anywhere in
# structure.md's own envelope §2). `derived_fact` reuses this repository's own already-established
# vocabulary for exactly this event category (identical usage in feature-computed/v1.0.yaml,
# feature.md §2, regime.md §2, swing.md §2, structure.md §2 itself). StructureRecomputed is the
# event type that establishes the new authoritative orientation after a cascade — a computed
# conclusion from refolding Swing/Candle facts, never a raw venue observation.

allowed_streams:
  - stream_id: structure-engine-structure
# Governed-authored from docs/architecture/stream-registry.yaml (Genesis Registry, `status:
# Approved`, `registry_version: v1.0`) + Chapter 8 §8.3.1. Same stream as the other three Structure
# event types — structure-engine's Structure fact family's own stream, per Approved ADR-036 v0.3's
# one-stream-per-fact-family topology.

merge_constraints:
  prerequisite_policy: causation_must_resolve_before_apply
# Governed-authored per Chapter 8 §8.3.4's own authority split. structure.md v0.4 §2 envelope fixes
# `causation_refs` as never empty for any Structure event — every StructureRecomputed's entire
# StructureFactInvalidated cascade set must resolve before this event may be applied, per Chapter 8
# §8.3.4's own P_causation/P_global DAG requirement.

payload_shape:
  resulting_orientation: {type: enum, values: [NEUTRAL, BULLISH, BEARISH], required: true}
  justifying_fact_ref: {type: event_record_ref, required: false, description: "REQUIRED when resulting_orientation != NEUTRAL; PROHIBITED when resulting_orientation = NEUTRAL — see invariants."}
  input_cursor_ref: {type: object, required: true, description: "Pins the exact cursor/input set (Swing + Candle facts still valid) used to refold this result, deterministic enough to reproduce it — Chapter 8 §8.1.1 Referenced Authoritative Artifact spirit. Field-level object schema NOT YET inlined — open authority gap, STOP recorded under STRUCT-EC-A-MAJ-04 (see header); whether this is the canonical Chapter 8 §8.5.1 Replay Cursor or a distinct Structure-specific shape is not yet mechanically determined by existing authority."}

payload_semantics_and_invariants:
  description: >
    The AUTHORITATIVE fact establishing the NEW current_orientation after a cascade of one or more
    StructureFactInvalidated (structure-fact-invalidated/v1.0.yaml) has fully completed — the ONE
    event type that changes current_orientation in the correction flow (symmetric to the normal
    flow, where BreakOfStructureDetected/ChangeOfCharacterDetected transition orientation directly).
    Always arises AFTER every fact affected by the cascade has already received its own
    StructureFactInvalidated — there is no "partial" StructureRecomputed. resulting_orientation is
    determined by directly refolding every still-valid Swing/Candle fact at input_cursor_ref — it
    can be NEUTRAL (no fact justifies any direction) or BULLISH/BEARISH (a still-valid fact, or a
    re-derived chain from input, still justifies that direction).
  invariants:
    - "envelope.causation_refs MUST point to every StructureFactInvalidated belonging to the same cascade — none affected by the cascade may be omitted from causation — see causal_state_dependency_declaration below for the canonical machine-readable classification."
    - "resulting_orientation MUST be one of {NEUTRAL, BULLISH, BEARISH} — NEVER UNDETERMINED (once a fact has existed and been invalidated, the minimum valid conclusion is NEUTRAL, never a regression to the notional UNDETERMINED starting point)."
    - "justifying_fact_ref is REQUIRED when resulting_orientation is BULLISH or BEARISH — MUST reference a still-valid (not yet StructureFactInvalidated) BreakOfStructureDetected/ChangeOfCharacterDetected directly justifying that direction; it is PROHIBITED when resulting_orientation is NEUTRAL (no surviving fact justifies any direction — that is precisely what NEUTRAL means)."
    - "input_cursor_ref is REQUIRED on every resulting_orientation, including NEUTRAL — it pins the exact cursor/input set used to refold this result, sufficient to deterministically reproduce it."
    - "envelope.recorded_time MUST be strictly later than the recorded_time of the last StructureFactInvalidated in the cascade."
    - "Exactly ONE StructureRecomputed is emitted per cascade — never more than one for the same invalidation set."
    - "This event does not delete or overwrite any prior output — it is an additional append-only fact (I-3)."
    - "Replay at a cursor before this event's own recorded_time MUST NOT observe it."

causal_state_dependency_declaration:
  mode: exhaustive
  roles:
    - role_id: cascade_invalidations
      selector:
        kind: by_target
        match:
          event_types: [STRUCTURE_FACT_INVALIDATED]
          contract_ids: [structure-fact-invalidated]
      cardinality:
        min: 1
        max: null
      classification: EXTERNAL_NON_STATE_CAUSE
      apply_time_requirement: >
        Authoritative application of StructureRecomputed does not require re-reading any referenced
        StructureFactInvalidated's own payload content — none of those references carry orientation
        data at all. This event's own resulting_orientation is computed by refolding Swing/Candle
        facts pinned via payload.input_cursor_ref — a mechanism entirely separate from
        causation_refs. The referenced StructureFactInvalidated set is required only as completeness
        proof that the cascade's invalidation set is fully committed before recomputing.
# Approved ADR-048 (docs/adr/ADR-048.md) canonical mechanism. One role, exhaustive: every
# causation_refs entry is a StructureFactInvalidated belonging to the same cascade — matching
# payload_semantics_and_invariants.invariants above exactly (causation_refs MUST point to every
# cascade member, never omitting one). Classification EXTERNAL_NON_STATE_CAUSE — no
# STATE_DEPENDENCY role exists for this event type (derivation v0.5 §2.6); resulting_orientation is
# computed via input_cursor_ref refold, never from the causation_refs targets' own payload. The
# `by_target` static-match selector targets the referenced events by envelope identity/pinned
# event_contract_ref only — target domain payload is never read. Duplicate canonical-locator
# (stream_id, sequence) rejection within this event's own causation_refs is governed generically by
# Approved ADR-048's own validation algorithm — no Structure-specific duplicate-detection algorithm
# is defined here.

