event_type: STRUCTURE_FACT_INVALIDATED
# structure.md v0.4 §2 event_types table (PAST_TENSE_UPPER_SNAKE per Chapter 3 §3.2, referenced not
# redefined here).

event_class: derived_fact
# Governed-authored. NOT `decision` (no decision_time/decision_context_cursor anywhere in
# structure.md's own envelope §2). `derived_fact` reuses this repository's own already-established
# vocabulary for exactly this event category (identical usage in feature-computed/v1.0.yaml,
# feature.md §2, regime.md §2, swing.md §2, structure.md §2 itself). This event purely negates one
# specific historical fact — it never itself asserts or implies an orientation transition
# (structure.md §1/§5) — but remains a computed/derived fact about the Structure fact stream, never
# a raw venue observation, so `derived_fact` (not `observation`) applies.

allowed_streams:
  - stream_id: structure-engine-structure
# Governed-authored from docs/architecture/stream-registry.yaml (Genesis Registry, `status:
# Approved`, `registry_version: v1.0`) + Chapter 8 §8.3.1. Same stream as
# break-of-structure-detected/v1.0.yaml and change-of-character-detected/v1.0.yaml —
# structure-engine's Structure fact family's own stream, per Approved ADR-036 v0.3's
# one-stream-per-fact-family topology.

merge_constraints:
  prerequisite_policy: causation_must_resolve_before_apply
# Governed-authored per Chapter 8 §8.3.4's own authority split. structure.md v0.4 §2 envelope fixes
# `causation_refs` as never empty for any Structure event — this event's invalidated_fact_ref AND
# its direct-cause reference(s) (one in the normal case, two in structure.md §10's rare dual-cause
# case) must all resolve before this event may be applied, per Chapter 8 §8.3.4's own
# P_causation/P_global DAG requirement.

payload_shape:
  invalidated_fact_ref: {type: event_record_ref, required: true, description: "BreakOfStructureDetected or ChangeOfCharacterDetected being negated — duplicates the corresponding causation_refs entry, declared explicitly in payload so query does not need to re-read the envelope."}
  invalidation_cause: {type: enum, values: [swing_invalidated, breaking_candle_corrected, chained_invalidation], required: true}
  invalidation_reason: {type: string, required: false}

payload_semantics_and_invariants:
  description: >
    Negates ONE specific BreakOfStructureDetected or ChangeOfCharacterDetected of the same
    structure_subject_id, due to a correction cascade — purely records "this historical fact is no
    longer valid," NEVER itself asserts or implies an orientation transition (that is
    StructureRecomputed's own exclusive role, structure-recomputed/v1.0.yaml). NEVER emitted merely
    because "price kept moving" (that is always a new, independent BOS/CHoCH belonging to normal
    flow, never an invalidation). Exactly THREE causes, declared explicitly via
    payload.invalidation_cause: (a) swing_invalidated — the fact's own broken_swing_ref received a
    SwingInvalidated (upstream correction) — the level used as the break basis is no longer valid;
    (b) breaking_candle_corrected — a Candle in the fact's own breaking_candle_refs received a
    CandleCorrected, so it no longer satisfies the break criterion under the corrected payload; (c)
    chained_invalidation — this fact depends (via its own prior_orientation, matching another
    fact's new_orientation) on ANOTHER fact that just received a StructureFactInvalidated in the
    SAME cascade — dependency-forward along the original orientation chain, NEVER "most-recent-
    first" by recorded_time. This is a new, append-only event. Valid even when the current
    orientation is already NEUTRAL (e.g. a second cascade layered on a prior one) — this event
    never checks or depends on current orientation, it only negates exactly one specific fact
    record. A single cascade emits MULTIPLE StructureFactInvalidated in sequence — one per affected
    fact — followed by exactly one StructureRecomputed. RARE CASE (structure.md §10's own
    "Deduplicate cascade" paragraph, fixes STRUCT-EC-A-MAJ-03): when ONE shared root correction
    propagates via two paths so that BOTH a SwingInvalidated (matching the invalidated fact's own
    broken_swing_ref) AND a CandleCorrected (matching one of its own breaking_candle_refs) directly
    affect the SAME fact simultaneously, still only ONE StructureFactInvalidated is emitted for
    that fact — causation_refs lists BOTH direct causes as separate entries, while
    payload.invalidation_cause (the scalar) selects the deterministic primary cause per Approved
    ADR-049 — see dual_cause_primary_selection below. This never applies to chained_invalidation
    (see dual_cause_primary_selection's own scope note).
  dual_cause_primary_selection:
    # Inlined (fixes STRUCT-EC-A-MAJ-03) — self-contained. The RULE below is Approved ADR-049 v0.2's
    # own new Decision (docs/adr/ADR-049.md, status: Approved, approved_at:
    # "2026-10-07T13:53:10+07:00") — NOT a rule mechanically derivable from structure.md alone.
    # structure.md §10 remains the authority for the existence of this rare dual-cause case and for
    # which refs causation_refs must list; it does not, by itself, mechanically close which of the
    # two is "most direct." Approved ADR-048 remains the authority for the representation grammar
    # (direct_cause_ref role below). Approved ADR-049 is cited here solely as the authority for the
    # deterministic scalar priority rule itself.
    scope: >
      Applies ONLY to the cascade's direct ancestor (the first StructureFactInvalidated in a
      cascade, caused directly by an upstream SwingInvalidated and/or CandleCorrected) — never to a
      chained_invalidation-caused descendant. By the dependency-forward chain's own linear
      construction (E(k+1).prior_orientation = E(k).new_orientation, structure.md §10), a
      chained_invalidation-caused fact depends on exactly ONE immediately-preceding
      StructureFactInvalidated, never two — the dual-cause case below never arises for it.
    rule: >
      Per Approved ADR-049 v0.2's own Decision: payload.invalidation_cause MUST be
      breaking_candle_corrected whenever causation_refs contains both a matching SwingInvalidated
      and a matching CandleCorrected direct-cause entry for this fact. This is ADR-049's own new
      decision, not a rule already mechanically present in structure.md's text — ADR-049 grounds it
      in structure.md's own declared domain chain ("Candle → Swing → Structure"), which already
      establishes Candle as the more fundamental upstream authority relative to Swing within this
      exact Domain Contract's stated model, giving a principled, in-scope, repository-grounded
      operational closure of structure.md §10's own "trực tiếp nhất tại chính
      broken_swing_ref/breaking_candle_refs" instruction — NOT a claim that every instance's
      causal-hop distance has been individually proven (ADR-049 v0.2 explicitly rejects that
      per-instance causal-distance argument as unprovable from in-scope authority; an earlier
      bounded-correction attempt on this artifact incorrectly presented that rejected argument as
      already mechanically derived from structure.md — this text replaces that error).
    not_applicable_when_single_cause: >
      When only one direct cause is present, payload.invalidation_cause selects exactly that cause
      (swing_invalidated, breaking_candle_corrected, or chained_invalidation per the invariants
      below) — ADR-049's rule only disambiguates the rare simultaneous two-direct-cause instance;
      it does not alter the single-cause case in any way.
  computation_identity_and_dedup:
    # Inlined (fixes PUB-AGG-MAJ-01) — self-contained, no reference to structure.md §11 required to
    # validate this artifact's own payload. Structure is internally computed from Swing/Candle
    # evidence (directly, or via the StructureFactInvalidated it chains from), never externally
    # redelivered — there is no source_identity/retry-redelivery concept (Chapter 6 §6.6) to dedup
    # against; identity and dedup are computation-based.
    computation_identity_tuple:
      - "structure_subject_id (envelope.subject_ref.subject_id)"
      - "event_type (STRUCTURE_FACT_INVALIDATED)"
      - "envelope.causation_refs, treated as a SET (order-independent) — invalidated_fact_ref plus the one or two direct_cause_ref entries (rare dual-cause case, dual_cause_primary_selection above)"
      - "the complete payload content above (invalidated_fact_ref, invalidation_cause, invalidation_reason)"
    dedup_rule: >
      Two computations whose identity tuple above matches exactly are the SAME authoritative fact.
      Recomputation from unchanged, still-valid authoritative input — e.g. a re-run after restart,
      or Live/Backtest/Replay independently recomputing the same cascade step — is idempotent and
      MUST NOT append a second StructureFactInvalidated record for it. This is distinct from, and
      additional to, the already-stated per-fact-targeting uniqueness invariant below (a given
      BOS/CHoCH receives exactly one authoritative StructureFactInvalidated) — that invariant bounds
      WHICH fact may be targeted at most once; this rule bounds whether two computations describing
      the SAME invalidation are themselves duplicates.
    distinct_facts_not_duplicates: >
      A StructureFactInvalidated targeting a different invalidated_fact_ref, or citing a different
      invalidation_cause/direct-cause set, is never a duplicate of this fact merely because some
      other field happens to match — the identity tuple above compares the full payload and the
      complete causation_refs set, not a partial subset.
  invariants:
    - "envelope.causation_refs MUST point to: the BOS/CHoCH event being invalidated (required, exactly one — see invalidated_fact_ref below); AND one OR (in structure.md §10's rare dual-cause case only) two direct-cause reference(s), with payload.invalidation_cause selected per dual_cause_primary_selection above (Approved ADR-049) — see causal_state_dependency_declaration below for the canonical machine-readable classification of each."
    - "invalidation_cause = swing_invalidated is valid ONLY when the referenced SwingInvalidated matches BOTH the swing_id AND the swing_revision of the invalidated fact's own broken_swing_ref (not swing_id alone) — a SwingInvalidated for one revision MUST NOT be used to invalidate a Structure fact whose broken_swing_ref used a different revision of the same swing_id."
    - "invalidation_cause = breaking_candle_corrected is valid ONLY when the corrected Candle is one of the invalidated fact's own breaking_candle_refs AND the corrected payload no longer satisfies the break criterion."
    - "invalidation_cause = chained_invalidation is valid ONLY when the invalidated fact's own prior_orientation equals exactly the new_orientation of the fact immediately preceding it in the original orientation chain — determined by the dependency graph, never by the invalidation's own recorded_time order. chained_invalidation NEVER co-occurs with a second direct-cause entry — see dual_cause_primary_selection's scope note above."
    - "A given BreakOfStructureDetected/ChangeOfCharacterDetected receives EXACTLY ONE authoritative StructureFactInvalidated — never a duplicate invalidation of the same fact twice, including in the rare dual-cause case (structure.md §10's own 'chỉ phát một StructureFactInvalidated cho fact đó')."
    - "This event carries no orientation field (no prior_orientation/new_orientation) — it is not, and must never be interpreted as, a state transition."
    - "envelope.recorded_time MUST be strictly later than the recorded_time of every direct cause event referenced (whichever of swing_invalidated/breaking_candle_corrected/chained_invalidation apply — one event in the normal case, two in the rare dual-cause case)."
    - "Replay at a cursor before this event's own recorded_time MUST NOT observe it."
    - "envelope.causation_refs contains EXACTLY invalidated_fact_ref (one entry) PLUS one OR two direct-cause entries (fixes STRUCT-EC-A-MAJ-03): exactly TWO entries total in the normal single-cause case; exactly THREE entries total ONLY in structure.md §10's rare dual-cause case, and ONLY when the two direct-cause entries are exactly {one event matching SWING_INVALIDATED, one event matching CANDLE_CORRECTED} — never two chained_invalidation-typed entries, never a chained_invalidation entry combined with a swing/candle entry, and never more than three entries total. See causal_state_dependency_declaration below, whose mode: exhaustive role cardinalities mechanically enforce the one-or-two-direct-cause bound; the {SwingInvalidated, CandleCorrected}-only restriction on the two-entry case is this Event Contract's own business invariant, not separately encoded by ADR-048's generic grammar."
    - "Two computations sharing an identical computation_identity_and_dedup tuple are the same authoritative fact — recomputation from unchanged input is idempotent and MUST NOT produce a second record (fixes PUB-AGG-MAJ-01; see computation_identity_and_dedup above)."

causal_state_dependency_declaration:
  mode: exhaustive
  roles:
    - role_id: invalidated_fact_ref
      selector:
        kind: payload_field
        path:
          - invalidated_fact_ref
      cardinality:
        exactly: 1
      classification: EXTERNAL_NON_STATE_CAUSE
      apply_time_requirement: >
        Authoritative application of StructureFactInvalidated does not require re-reading the
        invalidated BreakOfStructureDetected/ChangeOfCharacterDetected's own business content
        (broken_swing_ref, breaking_candle_refs, prior_orientation/new_orientation) — this event's
        own payload is exactly {invalidated_fact_ref, invalidation_cause, invalidation_reason}. A
        consumer applying this invalidation needs only to know WHICH fact is invalidated —
        identity, not the invalidated fact's own business content.
    - role_id: direct_cause_ref
      selector:
        kind: by_target
        match:
          event_types: [SWING_INVALIDATED, CANDLE_CORRECTED, STRUCTURE_FACT_INVALIDATED]
          contract_ids: [swing-invalidated, candle-corrected, structure-fact-invalidated]
      cardinality:
        min: 1
        max: 2
      classification: EXTERNAL_NON_STATE_CAUSE
      apply_time_requirement: >
        Authoritative application of StructureFactInvalidated does not require re-reading the
        causing fact's own payload content, regardless of which cause fired (SwingInvalidated,
        CandleCorrected, or a prior StructureFactInvalidated in the same cascade) — existence and
        commit-order proof only. This event's own payload never copies the causing fact's business
        content. In the rare dual-cause case (structure.md §10), this holds independently for each
        of the two direct-cause entries.
# Approved ADR-048 (docs/adr/ADR-048.md) canonical mechanism, fixes STRUCT-EC-A-MAJ-03. Two roles,
# exhaustive: every causation_refs entry is either the invalidated fact's own reference (exactly
# one, invalidated_fact_ref) or a direct-cause reference matching the static by_target.match
# allow-set above (one in the normal case, two in structure.md §10's rare dual-cause case,
# direct_cause_ref) — together exhaustively accounting for this event's own causation_refs,
# matching payload_semantics_and_invariants.invariants above exactly. A STATIC match selector is
# used, deliberately NOT a discriminated selector keyed on payload.invalidation_cause: a
# discriminated selector resolves the payload's single scalar enum value to exactly ONE `cases`
# entry per event, so in the dual-cause case the OTHER direct-cause entry would match no case —
# zero role matches, fail closed under ADR-048 §6 Phase 2 (§9 item 6) — regardless of cardinality.
# The static form tests every causation_refs entry against one fixed allow-set, independent of any
# payload field, so both direct-cause entries (when both are present) fall into this one role's
# match set; only cardinality needed widening, from {exactly: 1} to Form B {min: 1, max: 2} — both
# already part of ADR-048's existing closed grammar (§4 static match; §5 Form B range), applied
# here, not extended. Phase-2 exactly-one-role-match still holds for every entry:
# invalidated_fact_ref's target (a BreakOfStructureDetected/ChangeOfCharacterDetected) is never
# SWING_INVALIDATED/CANDLE_CORRECTED/STRUCTURE_FACT_INVALIDATED-typed, so it never falls into
# direct_cause_ref's match set — the two roles' match sets are disjoint by construction for every
# real instance (1-cause or 2-cause). Both roles EXTERNAL_NON_STATE_CAUSE — no STATE_DEPENDENCY
# role exists for this event type (derivation v0.5 §2.5); the category COUNT and classification are
# unaffected by this correction — only how many entries one existing category's role may match
# changed ({min: 1, max: 2} instead of exactly: 1). Duplicate canonical-locator (stream_id,
# sequence) rejection within this event's own causation_refs is governed generically by Approved
# ADR-048's own validation algorithm — no Structure-specific duplicate-detection algorithm is
# defined here.

