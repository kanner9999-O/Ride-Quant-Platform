    name: Decision Evaluation Engine
    module_type: compute_engine
    hybrid: null
    responsibilities:
      - "Platform-owned deterministic Decision evaluation của Strategy Instance tại decision_context_cursor (ADR-010, Chapter 8 §8.4-§8.5) — sinh non-authoritative evaluation output/proposal."
      - "KHÔNG sở hữu Decision identity, KHÔNG Decision append authority, KHÔNG Trade Intent identity, KHÔNG Risk approval authority, KHÔNG Execution authority (ADR-016 v0.8, Candidate B)."
    implements_capabilities: [decision-management]
    serves_contexts: [strategy-decision]
    owns_authoritative_state: false
    consumes: [event, query]
    emits: [event]
    depends_on: [strategy-engine, strategy-plugin-host, context-aggregator]
    forbidden_dependencies: [execution-engine, risk-gateway, paper-execution-boundary]
    plugin_relation: none
    security_classification: none
    phase: { identified_in: "1.1", elaborated_by: "1.3-C" }
    status: candidate
    notes: >
      ADR-016 v0.8 (Approved, 2026-08-04, Product Owner — Candidate B/split selected under
      Mechanism A) — tách từ `decision-engine` hybrid cũ (Candidate A, KHÔNG selected;
      superseded, xem "Alternatives considered" trong ADR-016 cho phân tích lịch sử). Output
      là non-authoritative evaluation proposal — `decision-authority-service` (dưới) sở hữu
      validate/append. KHÔNG modeled như second Strategy Plugin Host, KHÔNG authoritative
      Decision/Trade Intent writer, KHÔNG projection, KHÔNG runtime side-effect authority.
      Forbidden dependency enforces non-bypass của Risk Gateway/Execution (cùng nguyên tắc
      `strategy-plugin-host`). Ranh giới CHÍNH XÁC với `strategy-plugin-host` CHƯA resolve
      (residual risk #1, ADR-016 v0.8 Accepted risks) — CẦN further contract work, KHÔNG
      resolve tại transaction này.

  - module_id: decision-authority-service
    name: Decision Authority Service
    module_type: runtime_service
    hybrid: null
    responsibilities:
      - "Sole invariant-validation authority; sole authoritative Decision append authority; sole Decision identity authority (ADR-010, Chapter 8 §8.4/§8.5) và Trade Intent identity."
      - "Final acceptance/rejection tại authority boundary — validate evaluation proposal identity/version/cursor/eligibility từ `decision-evaluation-engine` trước khi append."
    implements_capabilities: [decision-management]
    serves_contexts: [strategy-decision]
    owns_authoritative_state: true
    consumes: [event, query]
    emits: [event]
    depends_on: [decision-evaluation-engine, strategy-engine]
    forbidden_dependencies: [execution-engine, paper-execution-boundary]
    plugin_relation: none
    security_classification: none
    phase: { identified_in: "1.1", elaborated_by: "1.3-C" }
    status: candidate
    notes: >
      ADR-016 v0.8 (Approved, 2026-08-04, Product Owner — Candidate B/split selected under
      Mechanism A) — thay thế `decision-engine` hybrid cũ. Decision TRƯỚC Trade Intent
      (preserved). Forbidden dependency enforces Decision cannot bypass Risk Gateway
      downstream. KHÔNG sở hữu Strategy Plugin advisory computation, Context Aggregator
      responsibility, Risk approval, hay Execution side effect nào. Mechanism A: ADR-016
      v0.8 tự nó amend hiệu lực kiểm soát của ADR-015 SCOPED cho module này + dependency
      edge liên quan — ADR-015 vẫn controlling cho 21/22 module còn lại (không đổi).

  - module_id: risk-gateway
    name: Risk Gateway
    module_type: runtime_service
    hybrid: null
    responsibilities:
      - "Sở hữu RiskEvaluation identity (bốn trục risk evidence độc lập) và Execution Intent identity."
      - "Risk Policy logic (exposure limit, approve/reject, risk-increasing detection, kill switch) — Chapter 3 §3.1 — LÀ business logic hợp lệ của đúng responsibility này (Chapter 7 §7.3: Type 3 Runtime Service KHÔNG có nghĩa chỉ làm I/O thuần túy), KHÔNG phải secondary taxonomy type/hybrid. Runtime Service taxonomy CHO PHÉP authoritative business policy/control logic như một phần bình thường của primary responsibility — không cần khai báo hybrid, không cần ADR."
    implements_capabilities: [risk-management]
    serves_contexts: [risk-gateway]
    owns_authoritative_state: true
    consumes: [event]
    emits: [event]
    depends_on: [decision-authority-service, account-service]
    forbidden_dependencies: []
    plugin_relation: none
    security_classification: trust_boundary_candidate
    phase: { identified_in: "1.1", elaborated_by: "1.3-D" }
    status: candidate
    notes: "Trade Intent TRƯỚC RiskEvaluation TRƯỚC Execution Intent (preserved). Risk Gateway consumes authoritative Decision output từ `decision-authority-service` (ADR-016 v0.8) — KHÔNG trực tiếp từ `decision-evaluation-engine` (non-authoritative)."

