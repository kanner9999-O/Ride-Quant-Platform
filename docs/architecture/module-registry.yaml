  # ---------------------------------------------------------------------
  # Backtest / Paper orchestration boundaries
  # ---------------------------------------------------------------------

  - module_id: backtest-orchestrator
    name: Backtest Orchestrator
    module_type: runtime_service
    hybrid: null
    responsibilities:
      - "Điều phối một bounded Backtest run gắn Strategy/version/configuration + stable run identity."
      - "Non-PAPER simulated authority — KHÔNG tái sử dụng PAPER Order/ExecutionResult/Fill/Position."
    implements_capabilities: [decision-management, risk-management]
    serves_contexts: [strategy-decision, risk-gateway]
    owns_authoritative_state: deferred
    consumes: [event]
    emits: [event]
    depends_on: [strategy-engine, decision-evaluation-engine, decision-authority-service, risk-gateway]
    forbidden_dependencies: [execution-engine, paper-execution-boundary, execution-result-processor, fill-processor, position-projection]
    plugin_relation: none
    security_classification: none
    phase: { identified_in: "1.1", elaborated_by: "1.3-A" }
    status: candidate
    notes: >
      DEFERRED COVERAGE — DD-001 (Backtest Domain Contract/entity/event/schema): no Domain
      Contract exists yet for Backtest-specific facts. owns_authoritative_state cannot be
      resolved to true/false until DD-001 is addressed (Product Owner decision, out of
      Package 1.1 scope). This module identifies the ORCHESTRATION boundary only — does NOT
      invent Backtest entities (BacktestOrder/BacktestFill/BacktestPosition/
      BacktestExecutionResult or equivalent remain forbidden per DD-001's own constraint).
      ADR-016 v0.8 correction: `decision-engine` dependency split into
      `decision-evaluation-engine` + `decision-authority-service` — bounded Backtest run
      cần cả evaluation VÀ authority append, không chỉ authoritative record access.

