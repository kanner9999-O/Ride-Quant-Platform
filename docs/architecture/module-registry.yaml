# Module Registry — Package 1.1 (Phase 1, System Decomposition & Module Registry)
#
# CANDIDATE — status: Draft, NOT Consolidated Stable, NOT Approved.
# Authority: Chapter 7 §7.5 (Locked) — module identity/taxonomy/mapping ONLY.
# This registry does NOT own: Business Capability/Domain Context identity (context-map.yaml,
# Chapter 4), domain concept semantics (Domain Contract, /docs/domain/), Product/UC/UX
# semantics (docs/product/), or runtime facts (event log).
#
# schema_version: 1 (Constitution does not mandate a filename/schema — this repository's
# own convention, storage/format deferred per Chapter 13 §13.14 / Chapter 7 §7.5).
#
# Field reference:
#   module_id                  stable machine-readable ID, snake/kebab-case, never reused
#   name                       display name
#   module_type                exactly one of: compute_engine | projection | runtime_service
#                               (Chapter 7 §7.1 — exhaustive, no invented fourth type)
#   hybrid                     null, or {secondary_responsibility, condition, adr_status}
#                               when module carries a secondary core responsibility of
#                               another taxonomy type (Chapter 7 §7.1, requires ALL 4
#                               conditions incl. ADR)
#   responsibilities           bounded list of what this module owns/does
#   implements_capabilities    capability_id(s) from context-map.yaml (must already exist there)
#   serves_contexts            domain_context_id(s) from context-map.yaml (must already exist there)
#   owns_authoritative_state   true | false | deferred — per I-12, only true if this module
#                               is the sole authoritative source for the state it emits
#   consumes                   contract categories consumed (event | query | command), not
#                               field-level schema
#   emits                      contract categories emitted (event | query | command), not
#                               field-level schema
#   depends_on                 module_id(s) this module requires (dependency direction)
#   forbidden_dependencies     module_id(s) this module MUST NOT depend on (boundary enforcement)
#   plugin_relation            none | hosts | is_plugin_definition | registry_for
#   security_classification    none | trust_boundary_candidate | custody_adjacent |
#                               secret_consuming — IDENTIFICATION ONLY, no implementation
#                               design (Package 1.2 scope)
#   phase                      Phase 1 sub-package this module is identified under (1.1)
#                               and which later package (1.2-1.6) elaborates its detailed
#                               architecture
#   status                     candidate (this document authors no module beyond `candidate`)
#   notes                      deferred items / authority gaps / rationale, when applicable

