# Input Contract — Feature Swing-distance profile (Chapter 8 §8.3.4)
#
# Feature-scoped Input Contract instance for feature_type = distance_to_last_confirmed_swing
# (feature.md §6/§7.3/§9a/§14) — the only founding feature type with a fixed dual-stream
# profile: exactly one Candle (reference price) plus exactly one Eligible SwingConfirmed
# (feature.md §9a's deterministic selection). This Input Contract does NOT replace or
# duplicate feature_definition_version, and does NOT decide Eligible-Swing selection —
# that remains feature.md §9a's own policy, applied against events this contract makes
# visible.
#
# Derivation, not invention: feature.md §14's own authoritative upstream enumeration lists
# exactly candle-closed/candle-corrected + swing-confirmed/swing-invalidated for this type
# — this contract's included_streams is the direct, mechanical transcription of that
# enumeration onto Approved ADR-036's stream topology (docs/architecture/stream-registry.yaml
# v0.1, registry_version v1). No new architecture decision is made by this file. This
# profile does NOT touch Regime, and does NOT touch Structure's BOS/CHoCH event family
# (structure-engine-structure) — feature.md §14 confirms Feature never consumes any
# Structure event; distance_to_last_confirmed_swing consumes only structure-engine's own
# Swing-detection layer (structure-engine-swing), a separate stream under the same module
# per ADR-036's topology.
#
# Event Contract eligibility (which event TYPES may target market-data-ingestion-candle /
# structure-engine-swing) is deliberately NOT represented here (Chapter 8 §8.3.1's one-way
# declaration rule) — that remains exclusively each event type's own Event Contract, not
# yet authored in this repository (same class of gap already flagged for
# computation_cursor's own fail-closed prerequisite, feature.md §12/ADR-035 §Consequences).

schema_version: 1
version: "0.1"
status: Draft
owner: Product Owner
generated_at: "2026-08-26"

input_contract_ref:
  contract_id: feature-swing-distance-input
  contract_version: v1

stream_registry_version: v1

included_streams:
  - market-data-ingestion-candle
  - structure-engine-swing

merge_policy:
  algorithm: deterministic-causal-topological-order
  concurrent_tie_break: [stream_id, sequence]

frontier_policy:
  mechanism: committed-stream-position-vector
  completeness_rule: all-included-streams-gap-free-committed-prefix
  late_arrival_behavior: defer-to-later-cursor
  buffer_limit_policy: unbounded-defer-fail-safe
  incomplete_frontier_behavior: defer-or-fail-safe-no-speculative-apply

causal_closure_policy:
  mode: declared-state-dependencies
  dependency_authority: per_effect_event_contract
