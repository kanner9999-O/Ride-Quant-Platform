#
# Context four-stream cut-capture protocol (identical structure/certification discipline
# to feature-context-architecture.md §4.6's reviewed algorithm — reproduced here in full
# because this file, unlike the three Feature Input Contracts, has no companion
# feature-context-architecture.md-equivalent Context design-spec document to host it;
# authoring such a document is out of this WP's file scope):
#
#   1. L_before := direct synchronous read of platform-lifecycle's current position
#      (Chapter 8 §8.5: {stream_id: platform-lifecycle, position: {kind, sequence}}).
#   2. registry_version := active_registry_at(L_before) — the already-Locked §8.3.1
#      function, computed once, locked for the remainder of this capture attempt.
#   2a. Registry-contract equality gate: registry_version MUST equal EXACTLY this
#      contract's own stream_registry_version pin below. If they differ, this Input
#      Contract instance is NOT applicable at this frontier — FAIL-SAFE / DEFER, no
#      cursor, no authoritative output, until a Product-Owner-governed Input Contract
#      version pinning the current registry is authored/selected. This is never a retry
#      condition — the cursor is never rewritten to a different registry while keeping
#      this same input_contract_ref (Chapter 8 §8.5.2's Registry -> Contract invariant).
#   3. For each of the four included_streams below (sequential, per-stream evaluation —
#      v0.2 correction, CONTEXT-IC-A-MAJ-01, makes this step total over Chapter-8-valid
#      genesis positions, per §8.5.3):
#      3a. Validate s belongs to the valid cursor universe under registry_version — confirm
#          s is active under registry_version (Chapter 8 §8.3.1). If s is NOT active under
#          registry_version, the cut cannot be constructed — integrity/topology mismatch,
#          fail-safe (I-6), no cursor produced.
#      3b. If s has one or more committed event positions available at the capture
#          boundary: a direct, synchronous read against s's own authoritative append-only
#          log (never a cached, asynchronously-delivered, or notification-derived value,
#          Chapter 8 §8.1's authoritative-source-is-the-log-not-transport rule) sets
#          stream_positions[s] = that current committed event sequence.
#      3c. If s belongs to the valid universe but has NO committed event yet:
#          stream_positions[s] = StreamRegistry[registry_version].genesis_position —
#          exactly as Chapter 8 §8.5.3 requires ("stream chưa có event dùng
#          genesis_position tường minh", "vắng mặt là mơ hồ giữa 'chưa có event' và 'quên
#          ghi'"). The stream key is NEVER omitted, NO sequence is fabricated, NO event is
#          fabricated at genesis, and NO recorded_time is fabricated for a genesis
#          position — genesis_position is a real position value from the pinned Stream
#          Registry, not a placeholder invented by this protocol. For this proposed v1.0
#          contract all four included_streams are active in the Genesis Registry v1.0
#          (fresh-verified) — no new retirement/lifecycle policy is authored by this
#          correction.
#   4. Run causal-closure fixed-point resolution (below) — may extend stream_positions
#      with further same-included-stream reads across any of the four streams; never
#      touches platform-lifecycle.
#   5. L_after := a second direct synchronous read of platform-lifecycle's current
#      position, performed AFTER step 4 completes.
#   6. Certification check: L_after must equal L_before EXACTLY. If equal, the capture is
#      CERTIFIED — no lifecycle event was appended anywhere across the entire sequential
#      four-stream capture window, so every read in steps 3-4 is provably a snapshot
#      under the SAME single registry_version locked in step 2 (already proven equal to
#      this contract's own pin, step 2a). If L_after != L_before, RACE DETECTED: the
#      entire capture attempt (steps 1-6) is discarded — no partial cursor, no stale
#      stream_registry_version, no cursor emitted for this attempt — and the SAME
#      protocol is retried from step 1 (a bounded structural retry of a deterministic
#      algorithm, never a numeric retry counter, wall-clock wait, or watermark).
#   7. computation_cursor derivation from a CERTIFIED cut (context.md §3/§4/§14, Chapter 8
#      §8.5): cursor.stream_positions = the closed (fixed-point) vector of directly-read
#      positions across all four included_streams (event-backed per step 3b, or
#      genesis_position per step 3c — every included stream is always represented in this
#      vector, never omitted, regardless of which); cursor.lifecycle_frontier = L_before
#      (= L_after, post-certification); cursor.stream_registry_version = this contract's
#      own pinned stream_registry_version (already proved equal to
#      active_registry_at(L_before) by step 2a).
#
#      cursor.recorded_time — precise definition (v0.2 correction, CONTEXT-IC-A-MAJ-01,
#      replaces v0.1's undefined-at-genesis shorthand):
#
#        T_position_events = { E.recorded_time | for included stream s, stream_positions[s]
#                              refers to an actual committed EVENT E }
#          — a stream_positions[s] entry set via step 3c (genesis_position) contributes NO
#          element to this set: no event exists at that position, so no recorded_time is
#          resolved, claimed, or fabricated for it.
#
#        T_lifecycle = { L_before.event.recorded_time }  when L_before.position.kind = event
#                       {}                                when L_before.position.kind = genesis
#          — Chapter 8 §8.5's own genesis carve-out; no synthetic event or wall-clock value
#          is invented when the lifecycle frontier is itself at genesis.
#
#        cursor.recorded_time = max(T_position_events ∪ T_lifecycle)
#
#      Context-specific non-empty guarantee: a genuine Context computation point is
#      Candle-driven (context.md §11) — the authoritative Candle event that creates/drives
#      that computation point MUST already exist and be represented by an event-backed
#      position on market-data-ingestion-candle whenever Context is actually evaluating
#      that point. T_position_events is therefore guaranteed non-empty for any genuine
#      Context computation attempt. If cut capture were attempted before any Candle
#      computation-point event exists, there is no Context computation point to evaluate at
#      all — no computation_cursor/output is produced in that case, by definition, not by a
#      fallback rule. No wall-clock or synthetic genesis timestamp is ever substituted.
#
#      Worked warm-up example (valid, fully-determined cursor boundary; correctly NO
#      snapshot due to missing analytical roles, not cursor failure):
#        market-data-ingestion-candle : event-backed, sequence 25, recorded_time = T25
#        structure-engine-structure   : genesis_position 0 (no event yet)
#        raw-regime-engine-regime     : genesis_position 0 (no event yet)
#        feature-engine-feature       : genesis_position 0 (no event yet)
#        lifecycle_frontier           : genesis (no lifecycle event yet)
#
#        stream_positions = {market-data-ingestion-candle: 25, structure-engine-structure: 0,
#                             raw-regime-engine-regime: 0, feature-engine-feature: 0}
#        T_position_events = {T25}  (only the Candle position resolves to an actual event)
#        T_lifecycle = {}           (lifecycle frontier is genesis)
#        cursor.recorded_time = max({T25} ∪ {}) = T25
#
#      This IS a valid, fully-determined computation_cursor — no field undefined, no
#      timestamp fabricated. context.md §8/§9 then correctly finds the Structure/Regime/
#      Feature analytical roles missing (empty Phase-1 survivor sets for those roles) and
#      emits NO MarketContextSnapshot for this computation point
#      (missing_input_policy: NO_SNAPSHOT_WHEN_ANY_REQUIRED_ROLE_MISSING_OR_PENDING). This
#      is valid warm-up, not cursor failure — the cursor itself is certified and complete;
#      it is context.md's own role selection, entirely separate from this Input Contract,
#      that correctly withholds a snapshot. No partial four-stream cursor may become
#      authoritative — a cut that is not certified across all four streams under one
#      coherent registry_version is never emitted as a computation_cursor.
#
# Deterministic causal closure — three-way classification, reused exactly (Chapter 8
# §8.2.3/§8.3.4/§8.3.5's own already-Locked validation-chain pattern, identical to the
# reviewed Feature Input Contract protocol):
#   (1) VALID IN-SCOPE CAUSE, OUTSIDE CURRENT CURSOR CUT — the referenced event already
#       exists and tuple-verifies in the authoritative log, but beyond what this cut has
#       read so far -> extend via a direct synchronous read of that specific named
#       (stream_id, sequence), then re-evaluate its own causation_refs the same way
#       (iterate to fixed point).
#   (2) VALID EXTERNAL NON-STATE CAUSE — a causation_ref pointing outside
#       included_streams entirely (Chapter 8 §8.3.4's external-non-state-cause
#       carve-out) — requires only an immutable committed/existence proof, never
#       participates in frontier completeness, payload MUST NOT be read.
#   (3) UNRESOLVABLE OR MISMATCHED REFERENCE — a direct read at the named
#       (stream_id, sequence) returns no record, or a record whose event_id does not
#       match -> INTEGRITY VIOLATION, fail-safe (I-6) immediately. A causation_ref can
#       never legitimately point to a not-yet-committed event (Chapter 6 §6.7: a
#       causation_ref is a direct domain causal predecessor — the cause must already have
#       existed for the effect to have been produced at all); this is never classified as
#       an ordinary late arrival.
#   Termination is guaranteed (Chapter 8 §8.3.4's mandatory-DAG P_global, no cycles, every
#   causation_refs set finite) — the fixed-point iteration visits each node at most once
#   and halts. Authoritative-apply is permitted ONLY at the fixed point.
#
