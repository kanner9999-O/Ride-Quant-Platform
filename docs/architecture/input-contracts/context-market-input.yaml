# Until Candle/Structure/Regime Event Contracts also exist and declare their own
# state-dependency classification, causal_closure_policy below remains correctly *pinned
# as architecture* but not yet *fully operationally provable* across all four
# included_streams — this candidate does not close that remaining gap, and does not claim
