# merge_constraints.prerequisite_policy: causation_must_resolve_before_apply) — these
# satisfy causal_closure_policy.dependency_authority: per_effect_event_contract ONLY for
# feature-engine-feature's two event types. Required Candle/Structure/Regime Event
# Contract authority remains completely absent/unresolved at this boundary — no Event
# Contract exists targeting market-data-ingestion-candle, structure-engine-structure, or
