# Input Contract — Feature Candle profile (Chapter 8 §8.3.4)
#
# Feature-scoped Input Contract instance for feature_type IN {volatility_metric,
# directional_persistence_metric} WHEN the pinned feature_definition_version selects
# upstream_source: candle (feature.md §6/§7.1-§7.2/§14). Selection is made entirely by
# Feature Definition semantics (feature.md §6's upstream_source field) — this Input
# Contract does NOT replace or duplicate feature_definition_version; it only supplies
# the cross-mode input scope + merge + frontier semantics feature.md's own
# computation_cursor.input_contract_ref (ADR-035, Approved) pins.
#
# Derivation, not invention: feature.md §14's own authoritative upstream enumeration
# lists exactly candle-closed/candle-corrected for this path — this contract's
# included_streams is the direct, mechanical transcription of that enumeration onto
# Approved ADR-036's stream topology (docs/architecture/stream-registry.yaml v0.1,
# registry_version v1). No new architecture decision is made by this file.
#
# Event Contract eligibility (which event TYPES may target market-data-ingestion-candle)
# is deliberately NOT represented here (Chapter 8 §8.3.1's one-way declaration rule) —
# that remains exclusively each event type's own Event Contract, not yet authored in
# this repository (same class of gap already flagged for computation_cursor's own
# fail-closed prerequisite, feature.md §12/ADR-035 §Consequences).
#
# v0.2 bounded correction (2026-08-26, closes P3-FEATURE-FRONTIER-A-MAJ-01/-MAJ-02):
# frontier_policy corrected -- mechanism/completeness_rule/incomplete_frontier_behavior/
# buffer_limit_policy replaced with a certified direct-log-read cut-capture protocol and
# exactly one deterministic incomplete-frontier outcome (no ambiguous "or" values, no
# invented numeric watermark). Full rationale: feature-context-architecture.md §4.6 v0.4.
# included_streams/merge_policy/causal_closure_policy/contract_id/contract_version:
# unchanged.
#
# v0.3 second bounded correction (2026-08-26, closes P3-FEATURE-FRONTIER-A-MAJ-01/-MAJ-02
# round 2): mechanism now certifies the (necessarily sequential) per-stream reads against a
# lifecycle_frontier BRACKET (read platform-lifecycle before and after capture, reject/retry
# on mismatch -- detects a registry/lifecycle transition racing the capture); completeness_
# rule/incomplete_frontier_behavior now require fixed-point (not single-extension) causal
# closure, with broken/unresolvable canonical references treated as immediate integrity-
# violation fail-safe, distinct from genuinely not-yet-committed positions. Full rationale:
# feature-context-architecture.md §4.6 v0.5. included_streams/merge_policy/
# causal_closure_policy/contract_id/contract_version/late_arrival_behavior/
# buffer_limit_policy: unchanged.
#
# v0.4 third bounded correction (2026-08-26, closes P3-FEATURE-FRONTIER-A-MAJ-01/-MAJ-02
# round 3, final normal correction): mechanism now includes a registry-contract equality
# gate (active_registry_at(L_before) must equal stream_registry_version exactly; mismatch
# = fail-safe/defer until a matching contract version is authored, never a retry);
# stream_registry_version/recorded_time cursor derivation completed (Registry -> Contract
# and Lifecycle -> Cursor invariants satisfied explicitly). completeness_rule/
# incomplete_frontier_behavior corrected: a causation_ref can never legitimately point to a
# not-yet-committed event (removed as an outcome) -- unresolvable/no-record references are
# now an immediate integrity-violation fail-safe, same as event_id mismatch. Full
# rationale: feature-context-architecture.md §4.6 v0.6. included_streams/merge_policy/
# causal_closure_policy/contract_id/contract_version/late_arrival_behavior/
# buffer_limit_policy: unchanged.

schema_version: 1
version: "0.4"
status: Draft
owner: Product Owner
generated_at: "2026-08-26"

input_contract_ref:
  contract_id: feature-candle-input
  contract_version: v1

stream_registry_version: v1

included_streams:
  - market-data-ingestion-candle

merge_policy:
  algorithm: deterministic-causal-topological-order
  concurrent_tie_break: [stream_id, sequence]

frontier_policy:
  mechanism: registry-pinned-lifecycle-bracketed-direct-log-read
  completeness_rule: gap-free-prefix-fixed-point-causal-closure-under-certified-registry-lifecycle-bracket
  late_arrival_behavior: defer-to-later-cursor
  buffer_limit_policy: fail-safe-abort-no-authoritative-output-on-resource-exhaustion
  incomplete_frontier_behavior: integrity-fail-safe-or-lifecycle-race-retry-or-registry-mismatch-defer

causal_closure_policy:
  mode: declared-state-dependencies
  dependency_authority: per_effect_event_contract
