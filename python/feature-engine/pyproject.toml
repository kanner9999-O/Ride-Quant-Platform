[project]
name = "feature-engine"
version = "0.1.0"
description = "Authoritative Feature Engine — Definition-pinned selective fan-in from Candle/Swing/Regime into deterministic Feature facts (feature.md)."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff==0.16.4",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "coverage==7.16.0",
    "mutmut==3.7.0",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src/feature_engine"]
pytest_add_cli_args_test_selection = ["tests/"]
mutate_only_covered_lines = false
type_check_command = []
timeout_constant = 1.0
timeout_multiplier = 15.0
only_mutate = []
do_not_mutate = []
do_not_mutate_patterns = []
