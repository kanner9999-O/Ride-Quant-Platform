[project]
name = "raw-regime-engine"
version = "0.1.0"
description = "Authoritative Raw Regime Engine — volatility / directional_persistence regime classification directly over canonical Candle facts (regime.md), structurally independent of Structure Engine (ADR-014)."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff==0.16.4",
    "mypy==2.3.1",
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
